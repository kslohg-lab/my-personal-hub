<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 아지트 (My Family Hub)</title>
    <!-- PWA / App Settings -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyHub">
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDK v9 (Modular Script) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzEFDmMpwoN4qYL8WHH-tesPWsSDvzHms",
            authDomain: "my-personal-hub-daf46.firebaseapp.com",
            projectId: "my-personal-hub-daf46",
            storageBucket: "my-personal-hub-daf46.firebasestorage.app",
            messagingSenderId: "157281213343",
            appId: "1:157281213343:web:99e65a7b08e269ad333baa",
            measurementId: "G-W41Q8308RG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Password Authentication Check
        window.checkPassword = function() {
            const inputPw = document.getElementById('accessPassword').value.trim();
            const errorMsg = document.getElementById('passwordError');
            if (inputPw === "0502") {
                sessionStorage.setItem('hub_authenticated', 'true');
                document.getElementById('lockScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                lucide.createIcons();
            } else {
                errorMsg.classList.remove('hidden');
                document.getElementById('accessPassword').value = '';
            }
        };

        // Auto login if session exists
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('hub_authenticated') === 'true') {
                document.getElementById('lockScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                lucide.createIcons();
            }
        });

        // Global Firebase functions
        window.sendMessage = async function(customText = null, customImageUrl = null) {
            const senderInput = document.getElementById('chatSender');
            const messageInput = document.getElementById('chatMessage');
            const sender = senderInput.value.trim() || '익명';
            const text = customText !== null ? customText : messageInput.value.trim();

            if (!text && !customImageUrl) return;

            try {
                await addDoc(collection(db, "chats"), {
                    sender: sender,
                    text: text,
                    imageUrl: customImageUrl || null,
                    timestamp: serverTimestamp()
                });
                messageInput.value = '';
            } catch (e) {
                console.error("Error sending message: ", e);
                alert("메시지 전송 실패. Firestore 규칙을 확인하세요.");
            }
        };

        // Image Compression & Upload Handler
        window.handleImageUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let width = img.width;
                    let height = img.height;
                    const MAX_WIDTH = 800;
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    window.sendMessage("사진을 공유했습니다.", compressedDataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        };

        // Realtime Listener
        const q = query(collection(db, "chats"), orderBy("timestamp", "asc"));
        onSnapshot(q, (snapshot) => {
            const chatBox = document.getElementById('chatMessages');
            if (!chatBox) return;
            chatBox.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                const currentSender = document.getElementById('chatSender')?.value.trim() || '익명';
                const isMe = data.sender === currentSender;
                const timeStr = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '방금';

                const msgDiv = document.createElement('div');
                msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-3`;
                
                let contentHtml = `<div class="text-sm">${data.text}</div>`;
                if (data.imageUrl) {
                    contentHtml += `<img src="${data.imageUrl}" class="mt-2 rounded-xl max-w-[200px] max-h-[200px] object-cover border border-slate-700 cursor-pointer" onclick="window.open('${data.imageUrl}')">`;
                }

                msgDiv.innerHTML = `
                    <span class="text-xs text-slate-400 mb-1 px-1">${data.sender}</span>
                    <div class="max-w-[85%] rounded-2xl px-4 py-2.5 ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none border border-slate-700'}">
                        ${contentHtml}
                    </div>
                    <span class="text-[10px] text-slate-500 mt-1 px-1">${timeStr}</span>
                `;
                chatBox.appendChild(msgDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- PASSWORD LOCK SCREEN -->
    <div id="lockScreen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl text-center space-y-6">
            <div class="w-16 h-16 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl mx-auto flex items-center justify-center text-indigo-400">
                <i data-lucide="lock" class="w-8 h-8"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-100 mb-1">가족 아지트 잠금</h2>
                <p class="text-xs text-slate-400">가족 비밀번호를 입력하여 입장하세요.</p>
            </div>
            <div class="space-y-3">
                <input type="password" id="accessPassword" onkeypress="if(event.key==='Enter') checkPassword()" placeholder="비밀번호 4자리" maxlength="4" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-center text-lg text-slate-100 tracking-widest focus:outline-none focus:border-indigo-500">
                <p id="passwordError" class="text-xs text-red-400 hidden">비밀번호가 틀렸습니다. 다시 입력해주세요.</p>
                <button onclick="checkPassword()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-indigo-600/30">입장하기</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="mainApp" class="hidden flex-1 flex flex-col pb-20">
        <!-- Header -->
        <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                    HUB
                </div>
                <div>
                    <h1 class="font-bold text-sm leading-none text-slate-100">내 아지트 (My Hub)</h1>
                    <p class="text-[10px] text-slate-400">PWA Family Web App</p>
                </div>
            </div>
        </header>

        <main class="flex-1 p-4 max-w-md mx-auto w-full">
            <!-- 1. HOME TAB -->
            <section id="tab-home" class="tab-content space-y-6">
                <div class="bg-gradient-to-br from-indigo-900/50 via-slate-900 to-purple-900/30 p-5 rounded-2xl border border-indigo-500/20 relative overflow-hidden shadow-xl">
                    <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-indigo-500/10 rounded-full blur-xl"></div>
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-semibold text-indigo-400 bg-indigo-950/80 border border-indigo-500/30 px-2.5 py-1 rounded-full">🚀 Welcome Back!</span>
                    </div>
                    <h2 class="text-xl font-bold text-slate-100 mb-1">우리 가족 디지털 공간</h2>
                    <p class="text-xs text-slate-400">가족 실시간 채팅, 사진 공유, 스케줄 관리를 한곳에서 즐겨보세요.</p>
                </div>

                <!-- Social Links -->
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-bold text-slate-200 flex items-center gap-1.5"><i data-lucide="link" class="w-4 h-4 text-indigo-400"></i> 소셜 채널</h3>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <a href="https://youtube.com" target="_blank" class="flex items-center gap-3 p-3 bg-slate-900 border border-slate-800 rounded-xl hover:border-red-500/50 transition-all">
                            <div class="w-9 h-9 rounded-lg bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-500"><i data-lucide="youtube" class="w-5 h-5"></i></div>
                            <div>
                                <div class="text-xs font-semibold text-slate-200">YouTube</div>
                                <div class="text-[10px] text-slate-400">내 창작 채널</div>
                            </div>
                        </a>
                        <a href="https://instagram.com" target="_blank" class="flex items-center gap-3 p-3 bg-slate-900 border border-slate-800 rounded-xl hover:border-pink-500/50 transition-all">
                            <div class="w-9 h-9 rounded-lg bg-pink-500
