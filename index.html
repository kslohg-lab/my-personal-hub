<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 아지트 (My Family Hub)</title>
    <!-- PWA / App Settings -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyHub">
    
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDK v9 (Modular Script) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzEFDmMpwoN4qYL8WHH-tesPWsSDvzHms",
            authDomain: "my-family-hub-daf46.firebaseapp.com",
            projectId: "my-family-hub-daf46",
            storageBucket: "my-family-hub-daf46.firebasestorage.app",
            messagingSenderId: "157281213343",
            appId: "1:157281213343:web:99e65a7b08e269ad333baa",
            measurementId: "G-W41Q8308RG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global Firebase functions
        window.sendMessage = async function() {
            const senderInput = document.getElementById('chatSender');
            const messageInput = document.getElementById('chatMessage');
            const sender = senderInput.value.trim() || '익명';
            const text = messageInput.value.trim();

            if (!text) return;

            try {
                await addDoc(collection(db, "chats"), {
                    sender: sender,
                    text: text,
                    timestamp: serverTimestamp()
                });
                messageInput.value = '';
            } catch (e) {
                console.error("Error sending message: ", e);
                alert("메시지 전송 실패. Firestore가 활성화되었는지 확인하세요.");
            }
        };

        // Realtime Listener
        const q = query(collection(db, "chats"), orderBy("timestamp", "asc"));
        onSnapshot(q, (snapshot) => {
            const chatBox = document.getElementById('chatMessages');
            if (!chatBox) return;
            chatBox.innerHTML = '';
            
            snapshot.forEach((doc) => {
                const data = doc.data();
                const isMe = data.sender === (document.getElementById('chatSender')?.value.trim() || '익명');
                const timeStr = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '방금';

                const msgDiv = document.createElement('div');
                msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-3`;
                msgDiv.innerHTML = `
                    <span class="text-xs text-slate-400 mb-1 px-1">${data.sender}</span>
                    <div class="max-w-[80%] rounded-2xl px-4 py-2 text-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none border border-slate-700'}">
                        ${data.text}
                    </div>
                    <span class="text-[10px] text-slate-500 mt-1 px-1">${timeStr}</span>
                `;
                chatBox.appendChild(msgDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col pb-20 selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                HUB
            </div>
            <div>
                <h1 class="font-bold text-sm leading-none text-slate-100">내 아지트 (My Hub)</h1>
                <p class="text-[10px] text-slate-400">PWA Family Web App</p>
            </div>
        </div>
    </header>

    <main class="flex-1 p-4 max-w-md mx-auto w-full">

        <!-- 1. HOME TAB -->
        <section id="tab-home" class="tab-content space-y-6">
            <div class="bg-gradient-to-br from-indigo-900/50 via-slate-900 to-purple-900/30 p-5 rounded-2xl border border-indigo-500/20 relative overflow-hidden shadow-xl">
                <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-indigo-500/10 rounded-full blur-xl"></div>
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-semibold text-indigo-400 bg-indigo-950/80 border border-indigo-500/30 px-2.5 py-1 rounded-full">🚀 Welcome Back!</span>
                </div>
                <h2 class="text-xl font-bold text-slate-100 mb-1">우리 가족 디지털 공간</h2>
                <p class="text-xs text-slate-400">가족 실시간 채팅, AI 게임, 스케줄 관리를 한곳에서 즐겨보세요.</p>
            </div>

            <!-- Social Links -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-slate-200 flex items-center gap-1.5"><i data-lucide="link" class="w-4 h-4 text-indigo-400"></i> 소셜 채널</h3>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <a href="https://youtube.com" target="_blank" class="flex items-center gap-3 p-3 bg-slate-900 border border-slate-800 rounded-xl hover:border-red-500/50 transition-all">
                        <div class="w-9 h-9 rounded-lg bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-500"><i data-lucide="youtube" class="w-5 h-5"></i></div>
                        <div>
                            <div class="text-xs font-semibold text-slate-200">YouTube</div>
                            <div class="text-[10px] text-slate-400">내 창작 채널</div>
                        </div>
                    </a>
                    <a href="https://instagram.com" target="_blank" class="flex items-center gap-3 p-3 bg-slate-900 border border-slate-800 rounded-xl hover:border-pink-500/50 transition-all">
                        <div class="w-9 h-9 rounded-lg bg-pink-500/10 border border-pink-500/20 flex items-center justify-center text-pink-500"><i data-lucide="instagram" class="w-5 h-5"></i></div>
                        <div>
                            <div class="text-xs font-semibold text-slate-200">Instagram</div>
                            <div class="text-[10px] text-slate-400">일상 & 개발</div>
                        </div>
                    </a>
                </div>
            </div>
        </section>

        <!-- 2. CHAT TAB (가족 채팅방) -->
        <section id="tab-chat" class="tab-content hidden flex-col h-[calc(100vh-140px)]">
            <div class="mb-3 flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2"><i data-lucide="message-square" class="w-5 h-5 text-indigo-400"></i> 가족 채팅방</h2>
                    <p class="text-xs text-slate-400">실시간으로 가족 메시지를 나누세요.</p>
                </div>
                <input type="text" id="chatSender" value="아빠" class="w-20 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-indigo-400 font-bold text-center focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Messages Box -->
            <div id="chatMessages" class="flex-1 bg-slate-900/60 border border-slate-800 rounded-2xl p-4 overflow-y-auto hide-scrollbar mb-3">
                <div class="text-center text-slate-500 text-xs py-8">메시지를 불러오는 중입니다...</div>
            </div>

            <!-- Input Box -->
            <div class="flex gap-2">
                <input type="text" id="chatMessage" onkeypress="if(event.key==='Enter') sendMessage()" placeholder="메시지를 입력하세요..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                <button onclick="sendMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 rounded-xl font-bold flex items-center justify-center transition-all">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </div>
        </section>

        <!-- 3. GAME TAB -->
        <section id="tab-games" class="tab-content hidden space-y-4">
            <div>
                <h2 class="text-lg font-bold text-slate-100">AI 미니 게임</h2>
                <p class="text-xs text-slate-400">웹 브라우저에서 바로 즐기는 게임</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg text-center space-y-3">
                <div class="flex justify-between text-xs text-slate-400">
                    <span>Cyber Runner</span>
                    <span id="scoreText">Score: 0</span>
                </div>
                <canvas id="gameCanvas" width="320" height="160" class="w-full bg-slate-950 rounded-xl border border-slate-800"></canvas>
                <button onclick="jumpGame()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-sm transition-all">점프 (Jump)</button>
            </div>
        </section>

        <!-- 4. PLANNER TAB -->
        <section id="tab-planner" class="tab-content hidden space-y-4">
            <div>
                <h2 class="text-lg font-bold text-slate-100">나의 일정 플래너</h2>
                <p class="text-xs text-slate-400">중요한 할 일과 일정을 관리하세요.</p>
            </div>
            <div class="flex gap-2">
                <input type="text" id="todoInput" placeholder="새 일정 추가..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                <button onclick="addTodo()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 rounded-xl text-sm font-semibold transition-all">추가</button>
            </div>
            <ul id="todoList" class="space-y-2"></ul>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 px-6 py-2 max-w-md mx-auto">
        <div class="flex justify-between items-center">
            <button onclick="switchTab('home')" id="nav-home" class="nav-item flex flex-col items-center gap-1 text-indigo-400">
                <i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-medium">홈</span>
            </button>
            <button onclick="switchTab('chat')" id="nav-chat" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
                <i data-lucide="message-square" class="w-5 h-5"></i><span class="text-[10px] font-medium">가족채팅</span>
            </button>
            <button onclick="switchTab('games')" id="nav-games" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
                <i data-lucide="gamepad-2" class="w-5 h-5"></i><span class="text-[10px] font-medium">AI게임</span>
            </button>
            <button onclick="switchTab('planner')" id="nav-planner" class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
                <i data-lucide="calendar" class="w-5 h-5"></i><span class="text-[10px] font-medium">일정</span>
            </button>
        </div>
    </nav>

    <script>
        lucide.createIcons();

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('text-indigo-400');
                el.classList.add('text-slate-400');
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            if(tabName === 'chat') document.getElementById(`tab-${tabName}`).classList.add('flex');
            
            const activeNav = document.getElementById(`nav-${tabName}`);
            activeNav.classList.remove('text-slate-400');
            activeNav.classList.add('text-indigo-400');
        }

        // Simple Todo Script
        let todos = JSON.parse(localStorage.getItem('my_hub_todos') || '[]');
        function renderTodos() {
            const list = document.getElementById('todoList');
            if(!list) return;
            list.innerHTML = '';
            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between p-3 bg-slate-900 border border-slate-800 rounded-xl text-sm';
                li.innerHTML = `
                    <span class="${todo.done ? 'line-through text-slate-500' : 'text-slate-200'} cursor-pointer" onclick="toggleTodo(${index})">${todo.text}</span>
                    <button onclick="deleteTodo(${index})" class="text-slate-500 hover:text-red-400 text-xs">삭제</button>
                `;
                list.appendChild(li);
            });
        }
        function addTodo() {
            const input = document.getElementById('todoInput');
            if(!input.value.trim()) return;
            todos.push({ text: input.value.trim(), done: false });
            localStorage.setItem('my_hub_todos', JSON.stringify(todos));
            input.value = '';
            renderTodos();
        }
        function toggleTodo(i) {
            todos[i].done = !todos[i].done;
            localStorage.setItem('my_hub_todos', JSON.stringify(todos));
            renderTodos();
        }
        function deleteTodo(i) {
            todos.splice(i, 1);
            localStorage.setItem('my_hub_todos', JSON.stringify(todos));
            renderTodos();
        }
        renderTodos();

        // Runner Game Engine
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        let player = { x: 30, y: 120, size: 15, dy: 0, jumping: false };
        let obstacle = { x: 320, size: 15, speed: 3 };
        let score = 0, gameRunning = true;

        function jumpGame() {
            if(!player.jumping) { player.dy = -8; player.jumping = true; }
        }
        function updateGame() {
            if(!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Ground
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 140, canvas.width, 20);

            // Player
            player.dy += 0.4;
            player.y += player.dy;
            if(player.y > 125) { player.y = 125; player.dy = 0; player.jumping = false; }
            ctx.fillStyle = '#6366f1';
            ctx.fillRect(player.x, player.y, player.size, player.size);

            // Obstacle
            obstacle.x -= obstacle.speed;
            if(obstacle.x < -20) { obstacle.x = 320; score += 10; document.getElementById('scoreText').innerText = `Score: ${score}`; }
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(obstacle.x, 125, obstacle.size, obstacle.size);

            // Collision
            if(player.x < obstacle.x + obstacle.size && player.x + player.size > obstacle.x && player.y + player.size > 125) {
                score = 0; obstacle.x = 320; document.getElementById('scoreText').innerText = `Score: ${score}`;
            }

            requestAnimationFrame(updateGame);
        }
        if(canvas) updateGame();
    </script>
</body>
</html>
