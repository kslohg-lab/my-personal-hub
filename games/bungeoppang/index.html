<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>붕어빵 타이쿤</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a2a22}}
:root[data-theme="dark"]{--bg:#3a2a22}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);overflow:hidden;position:relative;font-family:"Jua","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#5a3a22;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#box{position:absolute;left:0;top:0;width:450px;height:800px;transform-origin:0 0;overflow:hidden;border-radius:16px;background:#ffe9c9}
canvas{position:absolute;inset:0;width:450px;height:800px;touch-action:none}
.ov{position:absolute;inset:0;display:none}
button{font:inherit;color:#5a3a22;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #e0c4a0;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #e0c4a0}
#menu{background:linear-gradient(#ffd9a0,#fff1dc)}
.card{position:absolute;left:25px;top:70px;width:400px;box-sizing:border-box;padding:18px;background:#fff;border-radius:28px;text-align:center}
.card h2{margin:4px 0 10px;font-size:30px;font-weight:400}
.sh{background:rgba(60,35,20,.55)}
.big{width:100%;height:62px;font-size:24px;margin-top:12px;background:#ffc94a;box-shadow:0 4px 0 #d9a020}
.big.alt{background:#bfe8ff;box-shadow:0 4px 0 #8cc0e0}
.big.sm{height:52px;font-size:20px;background:#fff;box-shadow:0 4px 0 #e0c4a0}
.pill{display:inline-block;background:#fff3d6;border-radius:20px;padding:6px 14px;font-size:18px;margin:2px}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px}
.bt{height:54px;padding:0 14px;font-size:19px}
#home{position:absolute;right:4px;top:4px;width:48px;height:48px;font-size:24px;display:none;opacity:.9;padding:0}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:#5a3a22;color:#fff;padding:9px 18px;border-radius:20px;font-size:18px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#shl{height:540px;overflow-y:auto;touch-action:pan-y;text-align:left}
.dx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.dx div{background:#fff6e6;border-radius:14px;padding:8px 0;text-align:center;font-size:13px}.dx b{display:block;font-size:34px;font-weight:400}
.it{display:flex;align-items:center;gap:10px;background:#fff6e6;border-radius:18px;padding:8px 10px;margin-bottom:8px}
.it b{font-size:30px;font-weight:400;width:40px;text-align:center}
.it div{flex:1;font-size:15px;line-height:1.25}.it div span{font-size:19px}
.it button{width:104px;height:48px;font-size:17px;padding:0}
.it button.no{background:#eee;color:#aaa;box-shadow:0 4px 0 #d8d8d8}
</style></head><body>
<div id="box">
 <canvas id="cv" width="450" height="800"></canvas>
 <button id="home">⏸️</button>
 <div id="menu" class="ov">
  <div class="card" style="top:120px"><div style="font-size:84px;line-height:1.1">🐟</div><h2>붕어빵 타이쿤</h2><div id="mw"></div><p id="mi" style="font-size:17px;line-height:1.5;margin:10px 0 0"></p>
   <button id="m1" class="big"></button><button id="m2" class="big alt">🛒 가게 키우기</button><button id="m4" class="big sm">⭐ 별 보상 · 📖 도감</button><button id="m3" class="big sm">⚙️ 설정</button></div>
 </div>
 <div id="shop" class="ov sh"><div class="card" style="top:30px;height:740px;padding:14px"><h2 style="margin:0 0 4px;font-size:28px">🛒 가게 키우기</h2><div id="sw" style="margin-bottom:8px"></div><div id="shl"></div><button id="sx" class="big sm" style="margin-top:6px;height:48px">닫기</button></div></div>
 <div id="res" class="ov sh"><div class="card" style="top:90px"><h2 id="rt"></h2><div id="rbd" style="font-size:20px;line-height:1.6"></div><button id="r1" class="big">▶ 다음 날</button><button id="r2" class="big alt">🛒 가게 키우기</button><button id="r3" class="big sm">🏠 처음으로</button></div></div>
 <div id="pause" class="ov sh"><div class="card" style="top:200px"><h2>⏸️ 잠깐 멈췄어요</h2><button id="p1" class="big">▶ 계속하기</button><button id="p2" class="big sm">🏠 메뉴로 (오늘 장사 끝내기)</button></div></div>
 <div id="set" class="ov sh"><div class="card" style="top:180px"><h2>⚙️ 설정</h2><button id="sn" class="big sm"></button><button id="rs" class="big sm">🗑️ 저장 데이터 지우기</button><button id="sc" class="big sm">닫기</button></div></div>
 <div id="col" class="ov sh"><div class="card" style="top:30px;height:740px;padding:14px"><h2 style="margin:0 0 4px;font-size:28px">⭐ 별 보상 · 📖 도감</h2><div id="cw" style="margin-bottom:8px"></div><div id="cl" style="height:540px;overflow-y:auto;touch-action:pan-y;text-align:left"></div><button id="cbk" class="big sm" style="margin-top:6px;height:48px">닫기</button></div></div>
 <div id="toast"></div>
</div>
<script>
(()=>{
const W=450,H=800,$=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');
const KEY='bungeoppangV1';let save={};
try{save=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const DEF=()=>({coins:0,day:1,up:{mold:0,speed:0,pat:0,auto:0,cap:0,tip:0,fl:0,deco:0},snd:true,bestCombo:0,served:0,stars:{},tip:{},lu:[1,0,0,0],loc:0,st:[0,0,0],dex:{},dexDone:0});
save=Object.assign(DEF(),save);save.up=Object.assign(DEF().up,save.up);if(!save.stars)save.stars={};if(!save.tip)save.tip={};if(!Array.isArray(save.lu)||save.lu.length<4)save.lu=[1,0,0,0];if(!Array.isArray(save.st)||save.st.length<3)save.st=[0,0,0];if(!save.dex)save.dex={};if(!(save.loc>=0&&save.loc<4&&save.lu[save.loc]))save.loc=0;
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a),ri=n=>Math.floor(Math.random()*n),fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
const FL=[{n:'팥',e:'🫘',p:300,c:90,col:'#8a3b3b'},{n:'슈크림',e:'🍮',p:400,c:120,col:'#ffd45a'},{n:'치즈',e:'🧀',p:500,c:150,col:'#ffb830'},{n:'고구마',e:'🍠',p:500,c:150,col:'#b05ac0'},{n:'초코',e:'🍫',p:600,c:180,col:'#6a3a1f'}];
const AN=['🐶','🐱','🐰','🐻','🐼','🦊','🐯','🐸','🐵','🐧','🐹','🦁'];
const WE=[{e:'☀️',n:'맑은 날',sp:1,pat:1,tp:0,w:50},{e:'🌧️',n:'비 오는 날',sp:.78,pat:1.1,tp:.2,w:25},{e:'❄️',n:'추운 날',sp:1.3,pat:.85,tp:0,w:25}];
const UPS=[
{k:'mold',n:'틀 늘리기',e:'🔥',max:4,d:l=>'틀 '+(2+l)+'개 → '+(3+l)+'개',c:l=>[8000,18000,36000,64000][l]},
{k:'speed',n:'불 조절',e:'⏱️',max:5,d:l=>'굽는 시간 -6% (지금 -'+6*l+'%)',c:l=>4500+l*5500},
{k:'auto',n:'자동 반죽기',e:'🤖',max:1,d:()=>'빈 틀을 한 번 톡! 하면 반죽+속+덮기',c:()=>13000},
{k:'cap',n:'냉장고',e:'🧊',max:5,d:l=>'하루 재고 +4 (지금 '+(10+4*l)+'개)',c:l=>3300+l*4400},
{k:'pat',n:'친절 교육',e:'💬',max:5,d:l=>'손님 참을성 +8% (지금 +'+8*l+'%)',c:l=>3300+l*4400},
{k:'tip',n:'단골 마케팅',e:'💝',max:5,d:l=>'팁 +15% (지금 +'+15*l+'%)',c:l=>4500+l*5500},
{k:'fl',n:'새 맛 개발',e:'🆕',max:4,d:l=>FL[l+1].e+' '+FL[l+1].n+' 맛 열기',c:l=>[5500,11000,18000,26000][l]},
{k:'deco',n:'가게 꾸미기',e:'🏮',max:3,d:l=>['간판','파라솔','네온 불빛'][l]+' 달기 (손님 +6%)',c:l=>[6600,18000,33000][l]}];
const nMold=()=>2+save.up.mold,nFl=()=>1+save.up.fl,capF=()=>10+4*save.up.cap;
const LOC=[{n:'골목 가게',e:'🏠',pm:1,sp:1,cost:0,d:'처음 가게예요',wall:'#fff3dc'},{n:'공원',e:'🌳',pm:1.25,sp:1.1,cost:80000,d:'가격 ×1.25 · 손님 +10% · 단골이 많아요',wall:'#eaf6dc'},{n:'학교 앞',e:'🏫',pm:1.5,sp:1.25,cost:200000,d:'가격 ×1.5 · 손님 +25% · 급한 손님이 많아요',wall:'#e6eeff'},{n:'놀이공원',e:'🎡',pm:1.8,sp:1.35,cost:450000,d:'가격 ×1.8 · 손님 +35% · VIP·단체가 많아요',wall:'#ffe6f4'}];
const STAFF=[{n:'서빙 알바',e:'🐰',cost:40000,d:'완성된 붕어빵을 손님에게 알아서 건네요'},{n:'굽기 알바',e:'🐻',cost:90000,d:'익은 붕어빵을 알아서 뒤집고 꺼내요'},{n:'반죽 알바',e:'🦊',cost:70000,d:'빈 틀에 알아서 반죽과 속을 채워요'}];
const MS=[{n:5,e:'🎀',t:'리본 간판',d:'팁 +10%',k:'tip',v:.1},{n:12,e:'🌸',t:'벚꽃 장식',d:'손님 +5%',k:'sp',v:.05},{n:20,e:'🧁',t:'단골 쿠폰',d:'참을성 +10%',k:'pat',v:.1},{n:30,e:'🏆',t:'명예 훈장',d:'콤보 보너스 최대 +70%',k:'cmb',v:.2},{n:45,e:'🌈',t:'무지개 간판',d:'모든 판매가 +5%',k:'pr',v:.05},{n:60,e:'👑',t:'전설의 가게',d:'팁 +20%, 손님 +5%',k:'leg',v:1}];
const starsT=()=>Object.values(save.stars).reduce((a,b)=>a+b,0);
function perk(k){const T=starsT();let v=0;for(const m of MS)if(T>=m.n){if(m.k===k)v+=m.v;if(m.k==='leg'){if(k==='tip')v+=.2;if(k==='sp')v+=.05}}return v}
const evOf=d=>d%5?null:d%25===0?'critic':(d/5)%2?'fest':'bomb';
const EVN={fest:{e:'🎪',n:'축제의 날',d:'손님이 몰려와요! 팁 ×1.5',g:1.4},bomb:{e:'💣',n:'폭탄 주문의 날',d:'주문이 커요! 가격 ×1.25',g:1.2},critic:{e:'🧐',n:'평론가의 날',d:'평론가 출몰! 완벽한 ✨ 준비',g:1.3}};
const G0=d=>2500+53000*(1-Math.exp(-(d-1)/10)),gmul=()=>{const L=LOC[save.loc];return L.pm*(1+(L.sp-1)*.5)*(1+.35*save.st.reduce((x,y)=>x+y,0))};
const goalOf=(d,ev)=>Math.round(G0(d)*gmul()*(ev?EVN[ev].g:1)/100)*100;

/* ---------- audio ---------- */
let AC;const au=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC};
function tone(f,d,ty='sine',v=.14,t0=0,f2){if(!save.snd)return;const a=au();if(!a)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t0;o.type=ty;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d)}
const SND={tap(){tone(500,.08,'triangle',.1)},pour(){tone(300,.18,'sine',.12,0,180)},flip(){tone(700,.1,'square',.07,0,1000)},coin(){tone(988,.1,'triangle',.12);tone(1319,.2,'triangle',.12,.08)},perf(){[784,988,1319].forEach((f,i)=>tone(f,.16,'triangle',.12,i*.07))},burn(){tone(160,.4,'sawtooth',.16,0,60)},angry(){tone(220,.3,'square',.1,0,110)},ready(){tone(1200,.08,'sine',.07)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.14,i*.13))},no(){tone(200,.12,'square',.08)}};
const snd=k=>SND[k]();

/* ---------- state / screens ---------- */
let g=null,scr='menu',paused=false,shopBack='menu';
const show=n=>{['menu','shop','res','pause','set','col'].forEach(i=>$(i).style.display=i===n?'block':'none');$('home').style.display=scr==='game'?'block':'none'};
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1700)}
function renderMenu(){
 $('mw').innerHTML='<span class="pill">🪙 '+fmt(save.coins)+'</span><span class="pill">📅 '+save.day+'일차</span>';
 const ev=evOf(save.day);$('mi').innerHTML=LOC[save.loc].e+' '+LOC[save.loc].n+(ev?'<br>'+EVN[ev].e+' <b>오늘은 '+EVN[ev].n+'!</b>':'')+'<br>오늘 목표 <b>'+fmt(goalOf(save.day,ev))+'원</b><br>⭐ 별 '+starsT()+' · 🏅 최고 콤보 '+save.bestCombo+' · 📖 도감 '+Object.keys(save.dex).length+'/12';
 $('m1').textContent='▶ '+save.day+'일차 장사 시작'}
function renderShop(){
 $('sw').innerHTML='<span class="pill">🪙 '+fmt(save.coins)+'</span>';const L=$('shl');L.innerHTML='';
 UPS.forEach(u=>{const lv=save.up[u.k],mx=lv>=u.max,cost=mx?0:u.c(lv),can=!mx&&save.coins>=cost,d=document.createElement('div');d.className='it';
  d.innerHTML='<b>'+u.e+'</b><div><span>'+u.n+' <small>Lv '+lv+'/'+u.max+'</small></span><br>'+(mx?'최고 레벨!':u.d(lv))+'</div>';
  const b=document.createElement('button');b.textContent=mx?'완료 ✅':fmt(cost)+'🪙';if(!can)b.className='no';
  b.onclick=()=>{if(mx)return;if(save.coins<cost){toast('코인이 부족해요!');snd('no');return}save.coins-=cost;save.up[u.k]++;store();snd('win');renderShop();renderMenu()};
  d.appendChild(b);L.appendChild(d)});
 const hd=t=>{const p=document.createElement('p');p.style.cssText='margin:10px 0 6px;font-size:17px';p.innerHTML='<b>'+t+'</b>';L.appendChild(p)};
 const row=(e,n,d,label,can,fn)=>{const r=document.createElement('div');r.className='it';r.innerHTML='<b>'+e+'</b><div><span>'+n+'</span><br>'+d+'</div>';const b=document.createElement('button');b.textContent=label;if(!can)b.className='no';b.onclick=fn;r.appendChild(b);L.appendChild(r)};
 hd('🗺️ 가게 장소 (가격·손님이 달라져요)');
 LOC.forEach((lc,i)=>{const own=save.lu[i],pv=i===0||save.lu[i-1];
  if(own)row(lc.e,lc.n,lc.d,save.loc===i?'장사 중 ✅':'여기서 장사',save.loc!==i,()=>{save.loc=i;store();snd('tap');renderShop();renderMenu()});
  else row(lc.e,lc.n,lc.d,pv?fmt(lc.cost)+'🪙':'🔒 이전 먼저',pv&&save.coins>=lc.cost,()=>{if(!pv){toast('앞 장소를 먼저 열어요');return}if(save.coins<lc.cost){toast('코인이 부족해요!');snd('no');return}save.coins-=lc.cost;save.lu[i]=1;save.loc=i;store();snd('win');renderShop();renderMenu()})});
 hd('👥 직원 고용 (알아서 도와줘요)');
 STAFF.forEach((sf,i)=>{if(save.st[i])row(sf.e,sf.n,sf.d,'고용 완료 ✅',false,()=>{});else row(sf.e,sf.n,sf.d,fmt(sf.cost)+'🪙',save.coins>=sf.cost,()=>{if(save.coins<sf.cost){toast('코인이 부족해요!');snd('no');return}save.coins-=sf.cost;save.st[i]=1;store();snd('win');renderShop();renderMenu()})})}
$('m1').onclick=()=>{au();startDay()};
$('m2').onclick=()=>{au();shopBack='menu';renderShop();show('shop')};
function renderCol(){const T=starsT();$('cw').innerHTML='<span class="pill">⭐ '+T+'</span><span class="pill">📖 '+Object.keys(save.dex).length+'/12</span>';
 let h='<p style="margin:4px 0;font-size:16px"><b>⭐ 별 보상</b> (하루 별 3개면 보너스 코인!)</p>';
 MS.forEach(m=>{const on=T>=m.n;h+='<div class="it" style="'+(on?'':'opacity:.55')+'"><b>'+m.e+'</b><div><span>'+m.t+'</span><br>'+m.d+'</div><span style="font-size:15px;width:70px;text-align:center">'+(on?'✅ 획득':'⭐ '+m.n)+'</span></div>'});
 h+='<p style="margin:10px 0 6px;font-size:16px"><b>📖 동물 손님 도감</b> (12종 모으면 +15,000원)</p><div class="dx">';
 AN.forEach(a=>{const n=save.dex[a];h+='<div><b>'+(n!==undefined?a:'❓')+'</b>'+(n!==undefined?n+'번 방문':'아직 몰라요')+'</div>'});$('cl').innerHTML=h+'</div>'}
$('m4').onclick=()=>{au();renderCol();show('col')};$('cbk').onclick=()=>show('menu');
$('m3').onclick=()=>{au();$('sn').textContent=save.snd?'🔊 소리 켜짐':'🔇 소리 꺼짐';$('rs').textContent='🗑️ 저장 데이터 지우기';show('set')};
$('sn').onclick=()=>{save.snd=!save.snd;store();$('sn').textContent=save.snd?'🔊 소리 켜짐':'🔇 소리 꺼짐'};
$('sc').onclick=()=>show('menu');
$('sx').onclick=()=>{renderMenu();show(shopBack)};
$('rs').onclick=()=>{if($('rs').dataset.s!=='1'){$('rs').dataset.s='1';$('rs').textContent='⚠️ 정말 지울까요? 한 번 더!';setTimeout(()=>{$('rs').dataset.s='0';$('rs').textContent='🗑️ 저장 데이터 지우기'},3000)}else{save=DEF();store();$('rs').dataset.s='0';$('rs').textContent='🗑️ 저장 데이터 지우기';renderMenu();toast('모두 지웠어요')}};
function toMenu(){scr='menu';g=null;paused=false;renderMenu();show('menu')}
function pauseGame(){if(scr!=='game'||!g||paused||g.ph!=='play')return;paused=true;$('pause').style.display='block'}
function resumeGame(){if(!paused)return;paused=false;$('pause').style.display='none';last=0}
$('home').onclick=pauseGame;$('p1').onclick=resumeGame;
$('p2').onclick=()=>{if(g){save.coins=Math.max(0,save.coins+Math.round(g.net));store()}toMenu()};
$('r1').onclick=()=>{au();startDay()};$('r2').onclick=()=>{shopBack='res';renderShop();show('shop')};$('r3').onclick=toMenu;

/* ---------- game ---------- */
const tt=()=>Math.max(3.4,5*(1-.06*save.up.speed));
const qOf=p=>p<.94?'g':p<=1.06?'p':p<=1.3?'g':'b';
function startDay(){
 const d=save.day;let r=Math.random()*100,wi=0,acc=0;for(let i=0;i<WE.length;i++){acc+=WE[i].w;if(r<acc){wi=i;break}}
