<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>동물 친구 달리기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffeef5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2340}}
:root[data-theme="dark"]{--bg:#2b2340}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);overflow:hidden;position:relative;font-family:"Jua","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#5a3d6e;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#box{position:absolute;left:0;top:0;width:800px;height:400px;transform-origin:0 0;overflow:hidden;border-radius:16px;background:#cfeeff}
canvas{position:absolute;inset:0;width:800px;height:400px;touch-action:none}
.ov{position:absolute;inset:0;display:none}
button{font:inherit;color:#5a3d6e;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #d9c3e6;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #d9c3e6}
#menu{background:linear-gradient(#ffe3f1,#e0f4ff)}
.top{display:flex;align-items:center;gap:10px;height:52px;padding:0 12px}
.ttl{font-size:28px;flex:1}
.pill{background:#fff;border-radius:20px;padding:6px 14px;font-size:22px}
.rb{width:52px;height:46px;font-size:24px}
.cols{display:flex;gap:10px;padding:0 12px;height:334px}
.pn{background:rgba(255,255,255,.65);border-radius:20px;padding:8px 10px;box-sizing:border-box}
.pn h3{margin:0 0 6px;font-size:20px;font-weight:400}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cc{height:106px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cc b{font-size:38px;font-weight:400;line-height:1.1}
.cc.sel{outline:4px solid #ff9ec4}
.cc.lk,.sb.lk{background:#ece4f2;color:#a898b8}
.sb{height:68px;font-size:24px}
.big{width:100%;height:60px;font-size:22px;margin-top:12px;background:#ffd76a;box-shadow:0 4px 0 #e0b040}
#ci{margin:0 0 8px;font-size:17px;line-height:1.3}
#res,#set{background:rgba(70,40,100,.5)}
.card{position:absolute;left:130px;top:34px;width:540px;height:332px;box-sizing:border-box;padding:16px;background:#fff;border-radius:28px;text-align:center}
.card h2{margin:4px 0 10px;font-size:30px;font-weight:400}
#rbd{font-size:24px;line-height:1.5}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px}
.bt{height:62px;padding:0 18px;font-size:22px}
#home{position:absolute;right:6px;top:6px;width:54px;height:54px;font-size:26px;display:none;opacity:.85}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#5a3d6e;color:#fff;padding:10px 20px;border-radius:20px;font-size:20px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#rot{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;background:#ffe3f1;color:#5a3d6e;font-size:28px;text-align:center;line-height:1.6}
#rot b{font-size:80px;font-weight:400}
@media(orientation:portrait){#rot{display:flex}}
</style></head><body>
<div id="box">
 <canvas id="cv" width="800" height="400"></canvas>
 <button id="home">🏠</button>
 <div id="menu" class="ov">
  <div class="top"><span class="ttl">🐾 동물 친구 달리기</span><span id="wal" class="pill"></span><button id="gear" class="rb">⚙️</button></div>
  <div class="cols">
   <div class="pn" style="width:330px;overflow-y:auto;touch-action:pan-y"><h3>친구 고르기</h3><p id="ci"></p><div id="chs" class="grid3"></div></div>
   <div class="pn" style="flex:1"><h3>달리기 시작</h3><div id="sts"></div><button id="inf" class="big"></button></div>
  </div>
 </div>
 <div id="res" class="ov"><div class="card"><h2 id="rt"></h2><div id="rbd"></div><div class="row"><button id="r1" class="bt">🔁 다시 도전</button><button id="r2" class="bt">▶️ 다음 단계</button><button id="r3" class="bt">🏠 처음으로</button></div></div></div>
 <div id="set" class="ov"><div class="card" style="height:270px;top:64px"><h2>⚙️ 설정</h2><div class="row"><button id="sn" class="bt"></button></div><div class="row"><button id="rs" class="bt">🗑️ 저장 데이터 지우기</button></div><div class="row"><button id="sc" class="bt">닫기</button></div></div></div>
 <div id="toast"></div>
</div>
<div id="rot"><b>📱</b>화면을 가로로 돌려주세요</div>
<script>
(()=>{
const W=800,H=400,G=320,$=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');
const KEY='animalRunV2';let save={};
try{save=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
save=Object.assign({coins:0,un:[0,1,2],cleared:0,reach:1,best:0,sel:0,snd:true},save);
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a),m=(a,n)=>((a%n)+n)%n;
const CH=[
{x:'bunny',n:'토끼',d:'점프가 아주 높아요',p:0,b:'#fff3f8',a:'#ffb3d1',jh:1.19},
{x:'cat',n:'고양이',d:'슬라이드하면 체력이 차올라요',p:0,b:'#ffe0b8',a:'#ff9fb8',sh:5},
{x:'dog',n:'강아지',d:'코인을 멀리서 모아요',p:0,b:'#f6e1c8',a:'#c99a6a',cr:95},
{x:'fox',n:'여우',d:'체력이 천천히 줄어요',p:250,b:'#ffb98a',a:'#ffe9d6',hd:.75},
{x:'panda',n:'판다',d:'부딪혀도 덜 아파요',p:500,b:'#fff',a:'#5a4a6a',dm:.65},
{x:'bear',n:'곰돌이',d:'사과를 먹으면 체력이 더 차요',p:800,b:'#e0b48a',a:'#a87550',ap:15},
{x:'unicorn',n:'유니콘',d:'3단 점프를 해요',p:1200,b:'#f3e6ff',a:'#c89cff',mj:3},
{x:'star',n:'별요정',d:'파워업이 오래가요',p:1700,b:'#fff3a8',a:'#ffb84d',pb:1.6},
{x:'heart',n:'하트요정',d:'코인을 2배로 모아요',p:2300,b:'#ffc2e0',a:'#ff5a9a',cb:2},
{x:'dragon',n:'아기용',d:'튼튼하고 체력도 아껴요',p:3000,b:'#b8f0c8',a:'#7ad4a0',dm:.5,hd:.85}];
const TH=[{t:'#bfeaff',b:'#effcdc',h1:'#bfe8a8',h2:'#9ad98a',g:'#8fd16f',g2:'#6fb85a',d:['☁️','🌳']},
{t:'#ffc3a0',b:'#ffeab8',h1:'#e8a88c',h2:'#d98a7a',g:'#d9b06a',g2:'#b88c50',d:['☁️','🌴']},
{t:'#2b2d6e',b:'#6a5fb0',h1:'#4a4a99',h2:'#3a3a80',g:'#4f8a76',g2:'#3a6358',d:['⭐','🌲']},
{t:'#d6f0ff',b:'#f6fbff',h1:'#e0eefa',h2:'#c6dcf0',g:'#f4f8ff',g2:'#cfe0f0',d:['❄️','🌲']},
{t:'#ffb3a0',b:'#ffd9a0',h1:'#b0706a',h2:'#8a4a4a',g:'#7a5a52',g2:'#5e423c',d:['🔥','🌋']}];
const BOSS=['🦊','🐻','🐗','🐺','🦁','🦍','🐊','🦈','👹','🐉'];
const co=(t,n,y,a=0)=>Array.from({length:n},(_,i)=>['c',t+i*.12,y-(a&&n>1?Math.sin(i/(n-1)*Math.PI)*a:0)]);
const PT=[
{m:1,l:1.5,o:[['R',.5],...co(.2,6,285,90)]},
{m:1,l:1.5,o:[['L',.5],...co(.2,6,292)]},
{m:1,l:1.2,o:[...co(.1,8,292)]},
{m:1,l:2.6,o:[['R',.4],['R',1.4],...co(.1,5,285,90),...co(1.1,5,285,90)]},
{m:1,l:2.8,o:[['R',.4],['L',1.9],...co(.1,5,285,90),...co(1.7,5,292)]},
{m:2,l:1.7,o:[['P',.5],...co(.1,7,285,100)]},
{m:2,l:2.8,o:[['L',.4],['R',1.7],...co(.1,5,292),...co(1.5,5,285,90)]},
{m:3,l:1.6,o:[['B',.5],...co(.2,6,292)]},
{m:4,l:2.9,o:[['P',.4],['R',1.7],...co(.1,5,285,100),...co(1.5,5,285,90)]},
{m:4,l:2.3,o:[['L',.4],['L',1.3],...co(.1,10,292)]},
{m:5,l:2.8,o:[['B',.4],['R',1.8],...co(.1,5,292),...co(1.6,5,285,90)]},
{m:6,l:3.6,o:[['R',.3],['R',1.3],['R',2.3],...co(.1,5,285,90),...co(1.1,5,285,90),...co(2.1,5,285,90)]},
{m:7,l:2.9,o:[['B',.4],['L',1.6],...co(.1,5,292),...co(1.4,6,292)]}];

/* ---------- audio ---------- */
let AC;const au=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC};
function tone(f,d,ty='sine',v=.14,t0=0,f2){if(!save.snd)return;const a=au();if(!a)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t0;o.type=ty;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d)}
let lc=0;
const SND={coin(){const n=performance.now();if(n-lc<60)return;lc=n;tone(988,.1,'triangle',.12);tone(1319,.2,'triangle',.12,.08)},jump(){tone(300,.18,'sine',.14,0,720)},hit(){tone(180,.3,'sawtooth',.2,0,50)},warn(){for(let i=0;i<5;i++)tone(i%2?440:660,.18,'square',.09,i*.24)},boom(){tone(130,.7,'sawtooth',.25,0,30);tone(90,.8,'square',.14,.1,25)},pow(){[523,659,784].forEach((f,i)=>tone(f,.12,'square',.09,i*.1))},zap(){tone(1000,.25,'sawtooth',.14,0,200)},apple(){tone(600,.12,'sine',.14);tone(900,.2,'sine',.14,.1)},win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.28,'triangle',.15,i*.14))}};
const snd=k=>SND[k]();

/* ---------- state ---------- */
let g=null,scr='menu',down=false,keys={},ptr={};
const show=n=>{['menu','res','set'].forEach(i=>$(i).style.display=i===n?'block':'none');$('home').style.display=scr==='game'?'block':'none'};
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1800)}
function renderMenu(){
 $('wal').textContent='🪙 '+save.coins;
 const cs=$('chs');cs.innerHTML='';
 CH.forEach((c,i)=>{const u=save.un.includes(i),b=document.createElement('button');b.className='cc'+(save.sel===i?' sel':'')+(u?'':' lk');b.innerHTML=`${c.n}${u?'':'<br>🔒 '+c.p+'🪙'}`;const cn=document.createElement('canvas');cn.width=cn.height=100;cn.style.cssText='width:52px;height:52px'+(u?'':';opacity:.4');dc(cn.getContext('2d'),c,50,94,1.15,0,0);b.prepend(cn);
  b.onclick=()=>{au();if(u)save.sel=i;else if(save.coins>=c.p){save.coins-=c.p;save.un.push(i);save.sel=i;toast(c.n+' 친구가 함께해요! 🎉');snd('pow')}else{toast('코인이 부족해요! ('+c.p+'🪙 필요)');return}store();renderMenu()};cs.appendChild(b)});
 const c=CH[save.sel];$('ci').innerHTML=`<b>${c.n}</b><br>${c.d}`;
 const ss=$('sts');ss.innerHTML='';
 {const b1=document.createElement('button');b1.className='big';b1.textContent='▶️ 처음부터 달리기';b1.onclick=()=>{au();startGame('stage',1)};ss.appendChild(b1);
 if(save.reach>1){const b2=document.createElement('button');b2.className='big';b2.style.background='#9be0ff';b2.textContent='⏩ 이어서 ('+save.reach+'단계부터)';b2.onclick=()=>{au();startGame('stage',save.reach)};ss.appendChild(b2)}}
 const o=save.cleared>=10,f=$('inf');f.textContent=o?'♾️ 무한 모드 (최고 '+save.best+'m)':'🔒 무한 모드 (10단계 클리어 후)';f.onclick=()=>{au();o?startGame('inf',10):toast('10단계를 모두 클리어하면 열려요!')};
}
function toMenu(){if(scr==='game'&&g){save.coins+=g.coins;if(g.mode==='inf')save.best=Math.max(save.best,Math.floor(g.dist));store()}scr='menu';renderMenu();show('menu')}
$('home').onclick=toMenu;$('r3').onclick=toMenu;
$('gear').onclick=()=>{au();$('sn').textContent=save.snd?'🔊 소리 켜짐':'🔇 소리 꺼짐';$('rs').textContent='🗑️ 저장 데이터 지우기';$('set').style.display='block'};
$('sn').onclick=()=>{save.snd=!save.snd;store();$('sn').textContent=save.snd?'🔊 소리 켜짐':'🔇 소리 꺼짐'};
$('sc').onclick=()=>{$('set').style.display='none'};
$('rs').onclick=()=>{if($('rs').dataset.s!=='1'){$('rs').dataset.s='1';$('rs').textContent='⚠️ 정말 지울까요? 한 번 더!';setTimeout(()=>{$('rs').dataset.s='0';$('rs').textContent='🗑️ 저장 데이터 지우기'},3000)}else{save={coins:0,un:[0,1,2],cleared:0,reach:1,best:0,sel:0,snd:true};store();$('rs').dataset.s='0';$('rs').textContent='🗑️ 저장 데이터 지우기';renderMenu();toast('모두 지웠어요')}};

function startGame(mode,stage){
 g={mode,stage,c:CH[save.sel],t:0,dist:0,coins:0,hp:100,inv:0,ph:'run',ob:[],it:[],pa:[],pw:{boost:0,mag:0,giant:0},p:{y:G,vy:0,j:0,sl:false},boss:null,bgx:0,len:30+stage*2,seg:0,ban:2.2,spawnT:1.2,appleT:8,powT:22,shake:0,spd:300,endT:0,wt:0,zapT:1};
 scr='game';down=false;ptr={};keys={};show('none');
}
function jump(){const s=g;if(!s||s.ph==='dead'||scr!=='game')return;const p=s.p,mx=s.c.mj||2;if(p.j<mx){p.vy=-(640*(s.c.jh||1))*(p.j>0?.92:1);p.j++;snd('jump')}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();au();if(scr!=='game')return;const r=cv.getBoundingClientRect();if((e.clientX-r.left)/r.width<.5){ptr[e.pointerId]=1;down=true}else jump()});
const pu=e=>{if(ptr[e.pointerId]){delete ptr[e.pointerId];down=Object.keys(ptr).length>0||!!keys.d}};
addEventListener('pointerup',pu);addEventListener('pointercancel',pu);cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)jump()}if(e.code==='ArrowDown'){e.preventDefault();keys.d=1;down=true}});
addEventListener('keyup',e=>{if(e.code==='ArrowDown'){keys.d=0;down=Object.keys(ptr).length>0}});

/* ---------- helpers ---------- */
function pf(x,y,e,n=6,sp=200){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=rnd(.3,1)*sp;g.pa.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:rnd(.4,.8),e,s:rnd(18,30)})}}
const ft=(t,x,y,c)=>g.pa.push({x,y,vx:0,vy:-50,l:1,t,c});
function hurt(){const s=g,d=(s.ph==='boss'?13:20)*(s.c.dm||1);s.hp-=d;s.inv=s.ph==='boss'?3:2;s.shake=.3;snd('hit');pf(110,G-30,'💥',8)}
function spawn(){
 const s=g,st=s.mode==='inf'?10:s.stage,warm=s.seg<(s.stage<2?12:5);
 const pool=warm?[0,1,2]:PT.map((_,i)=>i).filter(i=>PT[i].m<=st);
 const pt=PT[pool[Math.floor(Math.random()*pool.length)]],sp=s.spd,x0=W+40;
 for(const o of pt.o){const x=x0+o[1]*sp;if(o[0]==='c')s.it.push({k:'c',x,y:o[2]});else s.ob.push({k:o[0],x,y:o[0]==='B'?268:o[0]==='L'?264:G})}
 const end=x0+(pt.l-.3)*sp;
 if(s.appleT<=0){s.it.push({k:'A',x:end,y:265});s.appleT=rnd(9,14)}
 else if(s.powT<=0&&!warm){s.it.push({k:'W',x:end,y:265,w:['🚀','🧲','🍄'][Math.floor(Math.random()*3)]});s.powT=rnd(20,30)}
 s.spawnT=pt.l+(warm?1.6:Math.max(.5,1.1-st*.05));
}
function bx(o){switch(o.k){case'R':case'S':return[o.x-14,G-34,o.x+14,G];case'L':return[o.x-22,244,o.x+22,288];case'B':return[o.x-14,252,o.x+14,286];default:return[o.x-14,o.y-14,o.x+14,o.y+14]}}
function collect(i){const s=g;
 if(i.k==='c'){s.coins+=s.c.cb||1;pf(i.x,i.y,'✨',2,120);snd('coin')}
 else if(i.k==='A'){s.hp=Math.min(100,s.hp+25+(s.c.ap||0));ft('체력 +25',110,G-90,'#ff6b8a');snd('apple');pf(110,G-40,'💖',5)}
 else if(i.k==='W'){const k={'🚀':'boost','🧲':'mag','🍄':'giant'}[i.w];s.pw[k]={boost:3,mag:5,giant:5}[k]*(s.c.pb||1);snd('pow');ft({boost:'부스터!',mag:'자석!',giant:'거대화!'}[k],110,G-90,'#ffb800')}
 else if(i.k==='Z'&&s.ph==='boss'){const b=s.boss;b.hp--;b.hurt=.4;s.shake=.25;snd('zap');pf(b.x,G-100,'⭐',10,300);ft('-1',b.x,G-170,'#ff5577');if(b.hp<=0)bossDown()}
}
function bossDown(){const s=g,b=s.boss,bn=30+s.stage*15;s.ph='win';s.endT=2.6;s.ob=[];b.ev=[];s.coins+=bn;snd('boom');snd('win');pf(b.x,G-100,'💥',30,420);pf(b.x,G-100,'🪙',14,320);ft('보너스 +'+bn+'🪙',400,150,'#ffb800')}

/* ---------- update ---------- */
function upd(dt){
 const s=g,p=s.p,pw=s.pw,c=s.c,dead=s.ph==='dead',win=s.ph==='win',st=s.mode==='inf'?10:s.stage;
 s.t+=dt;s.seg+=dt;if(s.ban>0)s.ban-=dt;for(const k in pw)if(pw[k]>0)pw[k]-=dt;
 if(s.inv>0)s.inv-=dt;if(s.shake>0)s.shake-=dt;
 const base=s.mode==='inf'?Math.min(600,330+s.t*2.5):280+s.stage*22;
 const spd=dead?0:base*(pw.boost>0?1.8:1)*(win?.6:1);s.spd=spd;s.bgx+=spd*dt;if(!dead)s.dist+=spd*dt/40;
 if(!dead){p.vy+=1800*dt;p.y+=p.vy*dt;if(p.y>=G){p.y=G;p.vy=0;p.j=0}}
 p.sl=down&&p.y>=G&&!dead;
 if(!dead&&!win){s.hp-=(s.ph==='boss'?1.6:2)*(c.hd||1)*dt;if(p.sl&&c.sh)s.hp=Math.min(100,s.hp+c.sh*dt);s.appleT-=dt;s.powT-=dt;
  if(s.hp<=0){s.hp=0;s.ph='dead';s.endT=1.4;snd('hit');pf(110,G-30,'💫',10)}}
 if(s.ph==='run'){if(s.mode==='stage'&&s.seg>=s.len){s.ph='warn';s.wt=2.6;snd('warn')}else{s.spawnT-=dt;if(s.spawnT<=0)spawn()}}
 else if(s.ph==='warn'){s.wt-=dt;if(s.wt<=0){s.ph='boss';const mx=4+Math.ceil(s.stage/2);s.boss={e:BOSS[s.stage-1],hp:mx,max:mx,x:W+170,hurt:0,cd:2.2,ev:[]};s.asp=360+s.stage*32;s.bwt=Math.max(.9,1.15-s.stage*.025)}}
 if(s.ph==='boss'){const b=s.boss;b.x+=((W-100)-b.x)*Math.min(1,3*dt);if(b.hurt>0)b.hurt-=dt;
  b.cd-=dt;
  if(b.cd<=0&&!b.ev.length){const L=['spike','drop'];if(st>=4)L.push('dbl');if(st>=6)L.push('c1','c2');const a=L[Math.floor(Math.random()*L.length)],w=s.bwt;
   b.ev=({spike:[['S',w]],drop:[['D',w]],dbl:[['S',w],['S',w+.9]],c1:[['S',w],['D',w+.9]],c2:[['D',w],['S',w+.9]]}[a]).map(e=>({k:e[0],t:e[1]}));b.cd=2.9-st*.15+b.ev[b.ev.length-1].t}
  for(const e of b.ev){e.t-=dt;if(e.t<=0){e.done=1;s.ob.push(e.k==='S'?{k:'S',x:W+20,y:G,v:s.asp}:{k:'D',x:W-90,y:-20,v:s.asp})}}
  b.ev=b.ev.filter(e=>!e.done);
  s.zapT-=dt;if(s.zapT<=0){s.it.push({k:'Z',x:W+30,y:G-rnd(40,130)});s.zapT=rnd(2.6,3.6)}
  if(s.appleT<=0){s.it.push({k:'A',x:W+30,y:265});s.appleT=rnd(8,12)}
 }
 const sc=pw.giant>0?1.7:1,hw=14*sc,hh=(p.sl?22:46)*sc,px0=110-hw,px1=110+hw,py0=p.y-hh;
 for(const o of s.ob){
  if(o.k==='D'&&o.y<272)o.y=Math.min(272,o.y+800*dt);else o.x-=(o.v||(o.k==='B'?spd+90:spd))*dt;
  if(dead||win)continue;
  let h;if(o.k==='P')h=Math.abs(o.x-110)<38&&p.y>=G-4;else{const b=bx(o);h=b[0]<px1&&b[2]>px0&&b[1]<p.y&&b[3]>py0}
  if(h){if(o.k!=='P'&&pw.giant>0){o.dead=1;pf(o.x,o.y||G-30,'💥',8);snd('hit')}else if(s.inv<=0&&pw.boost<=0&&!(o.k==='P'&&pw.giant>0))hurt()}
 }
 s.ob=s.ob.filter(o=>!o.dead&&o.x>-100);
 const cy=p.y-hh/2,rad=pw.boost>0?9999:pw.mag>0?240:c.cr||45;
 for(const i of s.it){
  i.x-=spd*dt;if(dead)continue;
  const dx=110-i.x,dy=cy-i.y,d=Math.hypot(dx,dy);
  if(i.k==='c'&&d<rad&&d>1){const v=Math.min((pw.boost>0?1400:650)*dt,d);i.x+=dx/d*v;i.y+=dy/d*v}
  if(Math.hypot(110-i.x,cy-i.y)<(i.k==='c'?26:40)*(sc>1?1.3:1)){i.dead=1;collect(i)}
 }
 s.it=s.it.filter(i=>!i.dead&&i.x>-60);
 for(const q of s.pa){q.x+=q.vx*dt;q.y+=q.vy*dt;if(!q.t)q.vy+=500*dt;q.l-=dt}
 s.pa=s.pa.filter(q=>q.l>0);
 if(dead||win){s.endT-=dt;if(s.endT<=0){if(win&&s.stage<10&&s.mode==='stage')nextSt();else fin(win)}}
}
function nextSt(){const s=g;s.stage++;save.reach=Math.max(save.reach,s.stage);store();s.seg=0;s.len=30+s.stage*2;s.ph='run';s.boss=null;s.ob=[];s.it=[];s.hp=Math.min(100,s.hp+35);s.ban=2.2;s.spawnT=1.5;s.inv=1.5;snd('win');ft('체력 +35',110,G-90,'#ff6b8a')}
function fin(win){
 const s=g;scr='result';save.coins+=s.coins;let first=false;
 if(s.mode==='stage'&&win&&s.stage>save.cleared){first=s.stage===10;save.cleared=s.stage}

 $('rt').textContent=s.mode==='inf'?'🏁 멋진 달리기였어요!':win?(first?'🏆 모든 단계 클리어!':'🎉 '+s.stage+'단계 클리어!'):'😢 '+s.stage+'단계까지 달렸어요!';
 $('rbd').innerHTML=`🪙 모은 코인 <b>${s.coins}</b><br>📏 달린 거리 <b>${d}m</b>${nb}`+(s.mode==='inf'?`<br>🥇 최고 기록 <b>${save.best}m</b>`:'')+(first?'<br>🎊 동물 친구들이 평화를 되찾았어요!<br>♾️ 무한 모드가 열렸어요!':'');
 $('r2').style.display=(s.mode==='stage'&&s.stage>1)?'':'none';
 $('r1').textContent='🔁 '+(s.mode==='stage'?s.stage+'단계부터':'다시 도전');$('r2').textContent='⏮️ 처음부터';$('r1').onclick=()=>startGame(s.mode,s.stage);$('r2').onclick=()=>startGame('stage',1);

}

/* ---------- draw ---------- */
const E='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function em(e,x,y,s,a=1){cx.globalAlpha=a;cx.font=s+'px '+E;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(e,x,y);cx.globalAlpha=1}
function tx(t,x,y,s,c='#fff',al='center',o='#7a5a8a'){cx.font='bold '+s+'px "Jua","Noto Sans KR","Malgun Gothic",sans-serif';cx.textAlign=al;cx.textBaseline='middle';cx.lineWidth=s/5;cx.strokeStyle=o;cx.lineJoin='round';cx.strokeText(t,x,y);cx.fillStyle=c;cx.fillText(t,x,y)}

function bg(th,x){

 for(let i=0;i<6;i++)em(th.d[0],m(i*190-x*.08,1140)-170,40+(i*53%80),40+(i%3)*12,.85);
 cx.fillStyle=th.h1;cx.beginPath();cx.moveTo(0,G);for(let X=0;X<=W;X+=20)cx.lineTo(X,G-95-Math.sin((X+x*.2)/110)*28-Math.sin((X+x*.2)/45)*8);cx.lineTo(W,G);cx.fill();
 cx.fillStyle=th.h2;cx.beginPath();cx.moveTo(0,G);for(let X=0;X<=W;X+=20)cx.lineTo(X,G-50-Math.sin((X+x*.4)/70)*16);cx.lineTo(W,G);cx.fill();
 for(let i=0;i<8;i++)em(th.d[1],m(i*140-x*.7,1120)-160,G-22,52);
 cx.fillStyle=th.g;cx.fillRect(0,G,W,H-G);cx.fillStyle=th.g2;cx.fillRect(0,G,W,6);
 for(let i=0;i<11;i++)cx.fillRect(m(i*90-x,990)-90,G+22+(i%3)*18,44,8);
}
function dc(X,c,x,y,s,t,po){
 const B=c.b,A=c.a,k=c.x,r=po===0?Math.sin(t*14):0,bob=po===0?Math.abs(r)*3:0,sw=po===1?0:Math.sin(t*10),O='#7a5a8a';
 const el=(x,y,a,b,f,o=1)=>{X.beginPath();X.ellipse(x,y,a,b,0,0,7);X.fillStyle=f;X.fill();if(o){X.lineWidth=2;X.strokeStyle=O;X.stroke()}};
 const tri=(a,b,c2,d,e,f,fl)=>{X.beginPath();X.moveTo(a,b);X.lineTo(c2,d);X.lineTo(e,f);X.closePath();X.fillStyle=fl;X.fill();X.lineWidth=2;X.strokeStyle=O;X.stroke()};
 const gl=(g,x,y,sz,f)=>{X.font=sz+'px sans-serif';X.textAlign='center';X.fillStyle=f;X.fillText(g,x,y)};
 X.save();X.translate(x,y);X.scale(s,s*(po===2?.62:1));X.lineJoin='round';X.lineCap='round';
 if(k==='fox'){el(-17,-22-bob+sw*2,10,5,'#ff9a60');el(-24,-22-bob+sw*2,3,3,'#fff',0)}
 if(k==='star'||k==='heart'||k==='dragon')el(-13,-30-bob,10,6+Math.abs(sw)*3,k==='dragon'?A:'#fff');
 for(const d of[-1,1]){const lx=d*6+(po===1?d*3:r*d*8),ly=po===1?-6:-3-Math.max(0,r*d)*5;X.beginPath();X.moveTo(d*6,-16-bob);X.lineTo(lx,ly);X.lineWidth=9;X.strokeStyle=O;X.stroke();X.lineWidth=5.5;X.strokeStyle=A;X.stroke()}
 el(0,-22-bob,11,10,B);gl('♥',0,-17-bob,11,A);
 for(const d of[-1,1])el(d*13-(po===1?0:r*d*3),-22-bob-(po===1?12:0),3.5,3.5,B);
 if(k==='bunny')for(const d of[-1,1]){el(d*8+sw*d,-64-bob,4.5,13,B);el(d*8+sw*d,-64-bob,2,9,A,0)}
 else if(k==='cat'||k==='fox'||k==='unicorn')for(const d of[-1,1])tri(d*16,-48-bob,d*14,-66-bob,d*4,-56-bob,k==='fox'?'#ff9a60':B);
 else if(k==='panda'||k==='bear')for(const d of[-1,1])el(d*13,-56-bob,6,6,A);
 else if(k==='dog')for(const d of[-1,1])el(d*17,-40-bob+sw,5,10,A);
 else if(k==='dragon')for(const d of[-1,1])tri(d*10,-55-bob,d*13,-68-bob,d*5,-57-bob,A);
 else if(k==='star'){X.beginPath();X.moveTo(0,-57-bob);X.lineTo(4,-66-bob+sw);X.lineWidth=2;X.strokeStyle=O;X.stroke();gl('★',4,-64-bob+sw,20,'#ffb800')}
 else if(k==='heart'){gl('♥',-9,-54-bob,20,A);gl('♥',9,-54-bob,20,A)}
 el(0,-42-bob,18,16,B);
 if(k==='unicorn'){tri(-3,-56-bob,0,-74-bob,3,-56-bob,'#ffd54a');el(-13,-50-bob,5,8,A)}
 if(k==='panda'){el(-4,-42-bob,6,7,'#8a7a9a',0);el(8,-42-bob,6,7,'#8a7a9a',0)}
 for(const e of[-4,8]){el(e,-42-bob,3.8,4.6,'#3a2a4a',0);el(e+1.3,-44-bob,1.5,1.5,'#fff',0);el(e-1.2,-40-bob,.8,.8,'#fff',0)}
 el(-9,-35-bob,3.5,2.2,'rgba(255,120,160,.55)',0);el(14,-35-bob,3.5,2.2,'rgba(255,120,160,.55)',0);
 X.beginPath();X.arc(3,-37-bob,2.5,.1,3.04);X.lineWidth=1.6;X.strokeStyle=O;X.stroke();
 X.restore()}
function draw(){
 const s=g,p=s.p,pw=s.pw,c=s.c,st=s.mode==='inf'?1+Math.floor(s.dist/400)%10:s.stage,th=TH[Math.min(4,(st-1)>>1)];
 cx.save();if(s.shake>0)cx.translate(rnd(-5,5),rnd(-5,5));
 bg(th,s.bgx);
 for(const o of s.ob){
  if(o.k==='P'){cx.fillStyle='#43344f';cx.fillRect(o.x-45,G,90,H-G);cx.fillStyle='#2e2238';cx.fillRect(o.x-45,G,90,8)}
  else if(o.k==='R')em('🪨',o.x,G-20,44);
  else if(o.k==='L'){cx.strokeStyle='#8a6a4a';cx.lineWidth=4;cx.beginPath();cx.moveTo(o.x,0);cx.lineTo(o.x,244);cx.stroke();em('🪵',o.x,266,54)}
  else if(o.k==='B')em('🐦',o.x,268+Math.sin(s.t*12)*4,42);
  else if(o.k==='S')em('🔺',o.x,G-18,40);

 }
 for(const i of s.it){
  if(i.k==='c'){cx.save();cx.translate(i.x,i.y);cx.scale(Math.abs(Math.cos(s.t*6+i.x*.02))+.15,1);em('🪙',0,0,28);cx.restore()}
  else{cx.beginPath();cx.arc(i.x,i.y,26,0,6.3);cx.fillStyle='rgba(255,255,200,.65)';cx.fill();em(i.k==='A'?'🍎':i.k==='Z'?'⚡':i.w,i.x,i.y+Math.sin(s.t*6)*3,38)}
 }
 if(s.boss){const b=s.boss,a=s.ph==='win'?Math.max(0,s.endT/2.6):1;cx.save();cx.translate(b.x+(b.hurt>0?rnd(-8,8):0),G-100+Math.sin(s.t*3)*8);if(b.hurt>0)cx.filter='brightness(1.6) sepia(1) hue-rotate(-30deg)';em(b.e,0,0,170,a);cx.restore();
  for(const e of b.ev)if(e.t<=s.bwt){const y=e.k==='S'?G-40:250,x=W-46,z=1+.15*Math.sin(s.t*20);cx.beginPath();cx.arc(x,y,24*z,0,6.3);cx.fillStyle='#ff3355';cx.fill();tx('!',x,y+1,34,'#fff','center','#ff3355')}}
 // player
 if(!(s.inv>0&&Math.floor(s.t*14)%2&&s.ph!=='dead')){
  const sc=pw.giant>0?1.7:1;cx.save();cx.translate(110,p.y);
  if(pw.boost>0){cx.beginPath();cx.arc(0,-26,42,0,6.3);cx.fillStyle='rgba(255,220,100,.6)';cx.fill();em('🚀',-44,-20,30)}
  const bob=p.y>=G&&!p.sl&&s.ph!=='dead'?Math.abs(Math.sin(s.t*14))*5:0;
  if(s.ph==='dead')cx.globalAlpha=.5;dc(cx,c,0,0,sc,s.t,p.y<G-4?1:p.sl?2:0);cx.restore();

 }
 for(const q of s.pa){if(q.t)tx(q.t,q.x,q.y,26,q.c,'center','#fff');else em(q.e,q.x,q.y,q.s,Math.min(1,q.l*2))}
 cx.restore();
 // HUD
 rr(40,12,230,22,11,'rgba(255,255,255,.75)');rr(40,12,230*s.hp/100,22,11,s.hp>35?'#7ee08a':'#ff7a8a');em('❤️',24,24,26);
 tx('🪙 '+s.coins,300,24,26,'#fff','left');tx('📏 '+Math.floor(s.dist)+'m',680,24,26,'#fff','right');
 tx(s.mode==='inf'?'♾️ 무한 모드':s.stage+'단계',490,24,24);
 if(s.mode==='stage'){rr(40,40,230,8,4,'rgba(255,255,255,.65)');rr(40,40,230*Math.min(1,s.seg/s.len),8,4,'#ffc83d');em('🏁',278,44,18)}
 let n=0;for(const [k,ic,d] of [['boost','🚀',3],['mag','🧲',5],['giant','🍄',5]])if(pw[k]>0){em(ic,28+n*66,72,28);rr(46+n*66-14,88,34*pw[k]/d,6,3,'#ffc83d');n++}
 if(s.boss&&s.ph!=='win'){rr(250,60,300,18,9,'rgba(255,255,255,.75)');rr(250,60,300*s.boss.hp/s.boss.max,18,9,'#ff5a7a');em(s.boss.e,236,69,28)}
 if(s.ph==='warn'){cx.fillStyle=`rgba(255,60,80,${.15+.12*Math.sin(s.t*12)})`;cx.fillRect(0,0,W,H);tx('⚠️ WARNING! ⚠️',400,170,64,'#fff','center','#e03050');tx('보스가 나타나요!',400,230,32)}
 if(s.ban>0){cx.globalAlpha=Math.min(1,s.ban);tx('⭐ '+s.stage+'단계! ⭐',400,150,56,'#fff','center','#ff7aa8');cx.globalAlpha=1}
 if(s.t<5&&s.mode){const a=Math.min(1,(5-s.t));cx.globalAlpha=a;tx('👈 왼쪽 꾹: 슬라이드',130,370,22);tx('오른쪽 톡: 점프 👉',670,370,22);cx.globalAlpha=1}
}
let last=0;
