                    { timeSlot: "1부 (06:30~08:30)", weekday: 160000, weekend: 230000, note: "남이천IC 3분" },

                ],
                cartFee: "100,000원",
                caddieFee: "150,000원",
                tags: ["남이천IC 3분", "접근성 최상", "대단지"]
            },
            {

                driveTimeMinutes: 58,

                rating: 4.7,
                grass: "조선잔디",

                officialWebsite: "http://www.solmoro.co.kr",
                courseDesc: "3m에 달하는 몬스터 벙커(솔모로 벙커)로 유명한 도전적 코스. 울창한 소나무 숲길 라운딩이 낭만적.",
                pricing: [
                    { timeSlot: "1부 (06:30~08:30)", weekday: 165000, weekend: 235000, note: "몬스터 벙커" },
                    { timeSlot: "2부 (12:00~14:00)", weekday: 185000, weekend: 255000, note: "소나무 명품" },
                    { timeSlot: "3부 (미운영)", weekday: 0, weekend: 0, note: "주간 전용" }
                ],
                cartFee: "100,000원",
                caddieFee: "150,000원",
                tags: ["몬스터 벙커", "소나무 명품", "도전적인"]
            },
            {
                id: "namseoul",
                name: "남서울CC",
                region: "이천/광주",
                location: "경기 성남시 분당구 백현동",
                driveTimeMinutes: 45,
                distanceKm: "32.0km",
                holes: "18홀",
                rating: 4.9,
                grass: "조선잔디/양잔디",
                greenSpeed: "3.2m",
                difficulty: "상급",
                officialWebsite: "http://www.nscc.co.kr",
                courseDesc: "GS칼텍스 매경오픈 개최지. 판교 신도시 바로 옆 최고 접근성을 자랑하며 정교하고 빠른 그린 스피드가 백미.",
                pricing: [
                    { timeSlot: "1부 (06:30~08:30)", weekday: 220000, weekend: 290000, note: "매경오픈 개최지" },
                    { timeSlot: "2부 (12:00~14:00)", weekday: 240000, weekend: 310000, note: "판교 근접" },
                    { timeSlot: "3부 (미운영)", weekday: 0, weekend: 0, note: "주간만 운영" }
                ],
                cartFee: "100,000원",
                caddieFee: "150,000원",
                tags: ["매경오픈 대회장", "판교 5분", "유리알 그린"]
            },
            {
                id: "gangnam_300",
                name: "강남300CC",
                region: "이천/광주",
                location: "경기 광주시 목현동",
                driveTimeMinutes: 52,
                distanceKm: "38.0km",
                holes: "18홀",
                rating: 4.1,
                grass: "조선잔디",
                greenSpeed: "2.6m",
                difficulty: "중급",
                officialWebsite: "http://www.kn300.or.kr",
                courseDesc: "강남/분당권 접근성이 뛰어난 도심 근교형 골프장. 산악 지형 업다운이 다소 존재함.",
                pricing: [
                    { timeSlot: "1부 (06:30~08:30)", weekday: 140000, weekend: 200000, note: "도심 근교" },
                    { timeSlot: "2부 (12:00~14:00)", weekday: 160000, weekend: 220000, note: "부킹 용이" },
                    { timeSlot: "3부 (미운영)", weekday: 0, weekend: 0, note: "주간 운영" }
                ],
                cartFee: "100,000원",
                caddieFee: "150,000원",
                tags: ["강남/분당 근교", "접근성", "산악지형"]
            }
        ];

        // State Management
        let currentRegionFilter = 'all';  // 'all' or specific region string
        let currentDayFilter = 'weekday'; // 'weekday' or 'weekend'
        let currentTimeSlot = 'all';     // 'all', 'slot1', 'slot2', 'slot3'
        let currentMaxDriveTime = 60;     // 30 or 60
        let currentSearchQuery = '';
        let currentSortBy = 'distance';

        // DOM Element Cache
        const golfCourseListEl = document.getElementById('golfCourseList');
        const golfCourseCountEl = document.getElementById('golfCourseCount');
        const searchInputEl = document.getElementById('searchInput');
        const sortSelectEl = document.getElementById('sortSelect');
        const resetFilterBtn = document.getElementById('resetFilterBtn');

        // Modal Elements
        const detailModal = document.getElementById('detailModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalTitle = document.getElementById('modalTitle');
        const modalLocation = document.getElementById('modalLocation');
        const modalDistanceTag = document.getElementById('modalDistanceTag');
        const modalHolesTag = document.getElementById('modalHolesTag');
        const modalGrass = document.getElementById('modalGrass');
        const modalGreenSpeed = document.getElementById('modalGreenSpeed');
        const modalDifficulty = document.getElementById('modalDifficulty');
        const modalCourseDesc = document.getElementById('modalCourseDesc');
        const modalPriceTable = document.getElementById('modalPriceTable');
        const modalCartFee = document.getElementById('modalCartFee');
        const modalCaddieFee = document.getElementById('modalCaddieFee');
        const modalTags = document.getElementById('modalTags');
        const modalWebLink = document.getElementById('modalWebLink');

        // Helper: Format Price
        function formatWon(num) {
            if (!num || num === 0) return "운영 없음";
            return (num / 10000).toLocaleString() + "만원";
        }

        // Helper: Get Lowest Price based on current day filter and time slot
        function getLowestPrice(course, dayType, timeSlot) {
            let availableSlots = course.pricing.filter(p => p[dayType] > 0);
            
            if (timeSlot === 'slot1') availableSlots = availableSlots.filter(p => p.timeSlot.includes('1부'));
            if (timeSlot === 'slot2') availableSlots = availableSlots.filter(p => p.timeSlot.includes('2부'));
            if (timeSlot === 'slot3') availableSlots = availableSlots.filter(p => p.timeSlot.includes('3부'));

            if (availableSlots.length === 0) return 0;
            const prices = availableSlots.map(p => p[dayType]);
            return Math.min(...prices);
        }

        /*
         * STREAMING_CHUNK:Filtering and Rendering Logic...
         */
        function renderGolfCourses() {
            // Filter logic
            let filtered = golfCoursesData.filter(course => {
                // Drive time filter
                if (course.driveTimeMinutes > currentMaxDriveTime) return false;

                // Region filter
                if (currentRegionFilter !== 'all' && course.region !== currentRegionFilter) {
                    return false;
                }

                // Search query filter
                if (currentSearchQuery.trim() !== '') {
                    const q = currentSearchQuery.toLowerCase();
                    const matchName = course.name.toLowerCase().includes(q);
                    const matchLoc = course.location.toLowerCase().includes(q);
                    const matchRegion = course.region.toLowerCase().includes(q);
                    const matchTags = course.tags.some(t => t.toLowerCase().includes(q));
                    if (!matchName && !matchLoc && !matchRegion && !matchTags) return false;
                }

                // Time slot availability filter
                if (currentTimeSlot !== 'all') {
                    const lowest = getLowestPrice(course, currentDayFilter, currentTimeSlot);
                    if (lowest === 0) return false;
                }

                return true;
            });

            // Sorting logic
            filtered.sort((a, b) => {
                if (currentSortBy === 'distance') {
                    return a.driveTimeMinutes - b.driveTimeMinutes;
                } else if (currentSortBy === 'priceAsc') {
                    const priceA = getLowestPrice(a, currentDayFilter, currentTimeSlot) || 9999999;
                    const priceB = getLowestPrice(b, currentDayFilter, currentTimeSlot) || 9999999;
                    return priceA - priceB;
                } else if (currentSortBy === 'rating') {
                    return b.rating - a.rating;
                }
                return 0;
            });

            golfCourseCountEl.textContent = filtered.length;

            if (filtered.length === 0) {
                golfCourseListEl.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-slate-200">
                        <i class="fa-solid fa-golf-ball-tee text-4xl text-slate-300 mb-3"></i>
                        <p class="font-bold text-slate-700 text-sm">검색 조건에 일치하는 골프장이 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-1">이동 시간(60분)이나 지역 필터를 넓혀보세요.</p>
                    </div>
                `;
                return;
            }

            // Render cards
            golfCourseListEl.innerHTML = filtered.map(course => {
                const lowestPrice = getLowestPrice(course, currentDayFilter, currentTimeSlot);
                const priceText = lowestPrice > 0 ? formatWon(lowestPrice) : "해당타임 없음";
                
                return `
                    <div onclick="openModal('${course.id}')" 
                         class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 hover:border-golf-500 hover:shadow-md transition cursor-pointer active:scale-[0.99] space-y-2.5">
                        
                        <!-- Top Row: Name & Drive Time -->
                        <div class="flex items-start justify-between">
                            <div>
                                <div class="flex items-center gap-1.5 mb-0.5">
                                    <span class="text-[10px] font-bold bg-golf-100 text-golf-800 px-1.5 py-0.5 rounded flex items-center gap-1">
                                        <i class="fa-solid fa-car text-[9px]"></i> H1에서 ${course.driveTimeMinutes}분
                                    </span>
                                    <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-medium">${course.region}</span>
                                </div>
                                <h2 class="text-base font-bold text-slate-900 leading-snug flex items-center gap-1.5">
                                    ${course.name}
                                    <span class="text-xs font-normal text-amber-500"><i class="fa-solid fa-star text-[10px]"></i> ${course.rating}</span>
                                </h2>
                                <p class="text-xs text-slate-500">${course.location} · ${course.holes}</p>
                            </div>
                            
                            <!-- Price Badge -->
                            <div class="text-right bg-slate-50 border border-slate-100 px-2.5 py-1.5 rounded-xl">
                                <div class="text-[9px] text-slate-400 font-medium">${currentDayFilter === 'weekday' ? '평일' : '주말'} 최저 그린피</div>
                                <div class="text-sm font-extrabold text-golf-700">${priceText}</div>
                            </div>
                        </div>

                        <!-- Mid Row: Specs & Highlights -->
                        <div class="grid grid-cols-3 gap-1 bg-slate-50 p-2 rounded-xl text-center text-[11px] text-slate-600 border border-slate-100">
                            <div>잔디: <strong class="text-slate-800">${course.grass.split('/')[0]}</strong></div>
                            <div class="border-x border-slate-200">그린: <strong class="text-golf-600">${course.greenSpeed}</strong></div>
                            <div>난이도: <strong class="text-slate-800">${course.difficulty}</strong></div>
                        </div>

                        <!-- Tags Row -->
                        <div class="flex flex-wrap gap-1 pt-0.5">
                            ${course.tags.map(tag => `<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-medium">#${tag}</span>`).join('')}
                        </div>

                        <!-- Bottom Callout -->
                        <div class="pt-1.5 border-t border-slate-100 flex items-center justify-between text-xs text-golf-700 font-semibold">
                            <span class="flex items-center gap-1 text-[11px]">
                                <i class="fa-solid fa-circle-info"></i> 코스 특징 및 타임별 요금 보기
                            </span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /*
         * STREAMING_CHUNK:Modal Handlers and Interactive Actions...
         */
        function openModal(courseId) {
            const course = golfCoursesData.find(c => c.id === courseId);
            if (!course) return;

            modalTitle.textContent = course.name;
            modalLocation.textContent = `${course.location} (${course.distanceKm})`;
            modalDistanceTag.textContent = `H1 기준 ${course.driveTimeMinutes}분 소요`;
            modalHolesTag.textContent = course.holes;
            modalGrass.textContent = course.grass;
            modalGreenSpeed.textContent = course.greenSpeed;
            modalDifficulty.textContent = course.difficulty;
            modalCourseDesc.textContent = course.courseDesc;
            modalCartFee.textContent = `카트피: ${course.cartFee}`;
            modalCaddieFee.textContent = `캐디피: ${course.caddieFee}`;
            modalWebLink.href = course.officialWebsite;

            // Render Price Table
            modalPriceTable.innerHTML = course.pricing.map(p => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="py-2.5 px-2.5 font-medium text-slate-800">${p.timeSlot}</td>
                    <td class="py-2.5 px-2.5 font-bold text-slate-700">${p.weekday > 0 ? formatWon(p.weekday) : '-'}</td>
                    <td class="py-2.5 px-2.5 font-bold text-golf-700">${p.weekend > 0 ? formatWon(p.weekend) : '-'}</td>
                    <td class="py-2.5 px-2.5 text-slate-400 text-[10px]">${p.note}</td>
                </tr>
            `).join('');

            // Render Tags
            modalTags.innerHTML = course.tags.map(tag => `
                <span class="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg border border-slate-200">#${tag}</span>
            `).join('');

            detailModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            detailModal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        /*
         * STREAMING_CHUNK:Event Listeners Attaching...
         */
        document.addEventListener('DOMContentLoaded', () => {
            renderGolfCourses();

            // Search input event
            searchInputEl.addEventListener('input', (e) => {
                currentSearchQuery = e.target.value;
                renderGolfCourses();
            });

            // Sort select event
            sortSelectEl.addEventListener('change', (e) => {
                currentSortBy = e.target.value;
                renderGolfCourses();
            });

            // Region Filter Buttons
            document.querySelectorAll('.region-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.region-btn').forEach(b => {
                        b.classList.remove('active', 'bg-slate-800', 'text-white');
                        b.classList.add('bg-slate-100', 'text-slate-600');
                    });
                    btn.classList.add('active', 'bg-slate-800', 'text-white');
                    btn.classList.remove('bg-slate-100', 'text-slate-600');

                    currentRegionFilter = btn.getAttribute('data-region');
                    renderGolfCourses();
                });
            });

            // Day Filter Buttons
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.day-btn').forEach(b => {
                        b.classList.remove('active', 'bg-golf-600', 'text-white', 'border-golf-600', 'shadow-sm');
                        b.classList.add('bg-white', 'text-slate-600', 'border-slate-200');
                    });
                    btn.classList.add('active', 'bg-golf-600', 'text-white', 'border-golf-600', 'shadow-sm');
                    btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200');

                    currentDayFilter = btn.getAttribute('data-day');
                    renderGolfCourses();
                });
            });

            // Distance Filter Buttons
            document.querySelectorAll('.dist-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.dist-btn').forEach(b => {
                        b.classList.remove('active', 'bg-golf-100', 'text-golf-800', 'border-golf-200', 'font-semibold');
                        b.classList.add('bg-white', 'text-slate-600', 'border-slate-200', 'font-medium');
                    });
                    btn.classList.add('active', 'bg-golf-100', 'text-golf-800', 'border-golf-200', 'font-semibold');
                    btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-200', 'font-medium');

                    currentMaxDriveTime = parseInt(btn.getAttribute('data-max-time'));
                    renderGolfCourses();
                });
            });

            // Time Slot Filter Buttons
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.time-btn').forEach(b => {
                        b.classList.remove('active', 'bg-slate-800', 'text-white');
                        b.classList.add('bg-slate-100', 'text-slate-600');
                    });
                    btn.classList.add('active', 'bg-slate-800', 'text-white');
                    btn.classList.remove('bg-slate-100', 'text-slate-600');

                    currentTimeSlot = btn.getAttribute('data-slot');
                    renderGolfCourses();
                });
            });

            // Reset Filter Event
            resetFilterBtn.addEventListener('click', () => {
                currentRegionFilter = 'all';
                currentDayFilter = 'weekday';
                currentTimeSlot = 'all';
                currentMaxDriveTime = 60;
                currentSearchQuery = '';
                searchInputEl.value = '';
                sortSelectEl.value = 'distance';
                currentSortBy = 'distance';

                // Reset Region Buttons
                document.querySelectorAll('.region-btn').forEach((b, idx) => {
                    if (idx === 0) {
                        b.classList.add('active', 'bg-slate-800', 'text-white');
                        b.classList.remove('bg-slate-100', 'text-slate-600');
                    } else {
                        b.classList.remove('active', 'bg-slate-800', 'text-white');
                        b.classList.add('bg-slate-100', 'text-slate-600');
                    }
                });

                // Reset Day Buttons
                document.querySelectorAll('.day-btn').forEach((b, idx) => {
                    if (idx === 0) {
                        b.classList.add('active', 'bg-golf-600', 'text-white', 'border-golf-600');
                        b.classList.remove('bg-white', 'text-slate-600');
                    } else {
                        b.classList.remove('active', 'bg-golf-600', 'text-white', 'border-golf-600');
                        b.classList.add('bg-white', 'text-slate-600');
                    }
                });

                // Reset Distance Buttons
                document.querySelectorAll('.dist-btn').forEach((b, idx) => {
                    if (idx === 0) {
                        b.classList.add('active', 'bg-golf-100', 'text-golf-800', 'border-golf-200');
                    } else {
                        b.classList.remove('active', 'bg-golf-100', 'text-golf-800', 'border-golf-200');
                        b.classList.add('bg-white', 'text-slate-600');
                    }
                });

                // Reset Time Buttons
                document.querySelectorAll('.time-btn').forEach((b, idx) => {
                    if (idx === 0) {
                        b.classList.add('active', 'bg-slate-800', 'text-white');
                    } else {
                        b.classList.remove('active', 'bg-slate-800', 'text-white');
                        b.classList.add('bg-slate-100', 'text-slate-600');
                    }
                });

                renderGolfCourses();
            });

            // Close Modal
            closeModalBtn.addEventListener('click', closeModal);
            detailModal.addEventListener('click', (e) => {
                if (e.target === detailModal) closeModal();
            });
        });
    </script>
