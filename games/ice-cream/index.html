<!DOCTYPE html>
<!--
  🍦 아이스크림 가게 타이쿤 — 내 아지트 미니 게임
  localStorage 키
   iceCreamV1     (메인 저장, JSON)
     coins      가진 코인
     day        지금 도전할 일차
     bestDay    도달한 최고 일차
     bestCombo  최고 연속 성공
     stars      {일차: 별 수}
     up         업그레이드 레벨 {speed, fz, helper, tip, sign, chair, decor}
     un         해금한 메뉴 {mg, mt, ck, sb, hn, pk, sk} + 꾸미기 수집 {c1~c6}
  (허브 v1.22: 목표 계산에서 업그레이드 배율 제외, 꾸미기·냉동고·팁 단계 확장, 꾸미기 수집 6종 추가)
     loc, lu    현재 가게 장소 번호 / 열린 장소 [1,0,0,0]
     dex        메뉴 도감 {조합: 만든 횟수}, dexM 받은 도감 보상 수
     snd, tut   소리 켜짐 / 튜토리얼 완료
   iceCreamV1run  (하루 도중 저장, 이어서 하기용 — 하루가 끝나거나 메뉴로 나가면 삭제)
     day, t, hearts, rev, fails, combo, bc, spawnT, cust[], hand, fz[], ev
-->
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>아이스크림 가게 타이쿤</title>
<style>
:root{--bg:#fff0f6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2236}}
:root[data-theme="dark"]{--bg:#2a2236}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-weight:700;color:#5a3a52}
body{position:relative}
#box{position:absolute;left:0;top:0;width:450px;height:800px;transform-origin:0 0;overflow:hidden;border-radius:16px;background:#ffeef6}
canvas{position:absolute;left:0;top:0;width:450px;height:800px;touch-action:none;display:block}
.ov{position:absolute;inset:0;display:none}
.sh{background:rgba(70,40,70,.55)}
button{font:inherit;color:#5a3a52;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #e6c4d8;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #e6c4d8}
.card{position:absolute;left:25px;top:60px;width:400px;box-sizing:border-box;padding:18px;background:#fff;border-radius:28px;text-align:center;max-height:720px}
.card h2{margin:4px 0 8px;font-size:29px;font-weight:700}
.big{width:100%;height:58px;font-size:22px;margin-top:10px;background:#ffd2e6;box-shadow:0 4px 0 #e0a0c0}
.big.pri{background:#ffe27a;box-shadow:0 4px 0 #dcb23a}.big.alt{background:#bfe8ff;box-shadow:0 4px 0 #8cc0e0}.big.sm{height:50px;font-size:19px;background:#fff;box-shadow:0 4px 0 #e6c4d8}
.big.dis{opacity:.4;pointer-events:none}
.pill{display:inline-block;background:#fff0f6;border-radius:20px;padding:5px 12px;font-size:17px;margin:2px}
#home{position:absolute;right:4px;top:4px;width:48px;height:48px;font-size:24px;display:none;opacity:.92;padding:0}
#toast{position:absolute;left:50%;top:330px;transform:translateX(-50%);background:#5a3a52;color:#fff;padding:9px 18px;border-radius:20px;font-size:19px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.lst{overflow-y:auto;touch-action:pan-y;text-align:left}
.it{display:flex;align-items:center;gap:10px;background:#fff0f6;border-radius:18px;padding:8px 10px;margin-bottom:8px}
.it b{font-size:30px;font-weight:400;width:40px;text-align:center}
.it div{flex:1;font-size:15px;line-height:1.25}.it div span{font-size:18px}
.it button{width:104px;height:46px;font-size:16px;padding:0}
.it button.no{background:#eee;color:#aaa;box-shadow:0 4px 0 #d8d8d8}
.dx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dx div{background:#fff0f6;border-radius:14px;padding:8px 2px;text-align:center;font-size:20px}.dx small{display:block;font-size:12px;color:#8a6a82}
</style></head><body>
<div id="box">
 <canvas id="cv"></canvas>
 <button id="home">⏸️</button>
 <div id="menu" class="ov" style="background:linear-gradient(#ffd6ea,#e6f6ff)">
  <div class="card" style="top:90px"><div style="font-size:78px;line-height:1.1">🍦</div><h2>아이스크림 가게</h2><div id="mw"></div><p id="mi" style="font-size:17px;line-height:1.5;margin:8px 0 0"></p>
   <button id="m1" class="big pri"></button><button id="m5" class="big sm" style="display:none"></button><button id="m2" class="big alt">🛒 가게 키우기</button>
   <div style="display:flex;gap:8px"><button id="m3" class="big sm">📖 메뉴 도감</button><button id="m4" class="big sm">⚙️ 설정</button></div></div>
 </div>
 <div id="shop" class="ov sh"><div class="card" style="top:24px;height:752px;padding:14px"><h2 style="margin:0 0 4px;font-size:26px">🛒 가게 키우기</h2><div id="sw"></div><div id="shl" class="lst" style="height:590px"></div><button id="sx" class="big sm" style="margin-top:6px;height:46px">닫기</button></div></div>
 <div id="dex" class="ov sh"><div class="card" style="top:24px;height:752px;padding:14px"><h2 style="margin:0 0 4px;font-size:26px">📖 메뉴 도감</h2><div id="dw"></div><div id="dl" class="lst" style="height:590px"></div><button id="dx2" class="big sm" style="margin-top:6px;height:46px">닫기</button></div></div>
 <div id="res" class="ov sh"><div class="card" style="top:70px"><h2 id="rt"></h2><div id="rbd" style="font-size:19px;line-height:1.6"></div><button id="r1" class="big pri"></button><button id="r2" class="big alt">🛒 가게 키우기</button><button id="r3" class="big sm">🏠 처음으로</button></div></div>
 <div id="pause" class="ov sh"><div class="card" style="top:200px"><h2>⏸️ 잠깐 멈췄어요</h2><button id="p1" class="big pri">▶ 계속하기</button><button id="p2" class="big sm">🏠 메뉴로 (오늘 장사 포기)</button></div></div>
 <div id="set" class="ov sh"><div class="card" style="top:170px"><h2>⚙️ 설정</h2><button id="sn" class="big sm"></button><button id="rs" class="big sm"></button><button id="sc" class="big sm">닫기</button></div></div>
 <div id="tut" class="ov sh"><div class="card" style="top:150px"><div id="tem" style="font-size:70px"></div><h2 id="tt"></h2><p id="tp" style="font-size:20px;line-height:1.5;margin:6px 0"></p><button id="tn" class="big pri"></button></div></div>
 <div id="toast"></div>
</div>
<script>
(()=>{
const W=450,H=800,$=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');let K=1;
const KEY='iceCreamV1',KRUN='iceCreamV1run';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const DEF=()=>({tr:null,coins:0,day:1,bestDay:1,bestCombo:0,stars:{},up:{speed:0,fz:0,helper:0,tip:0,sign:0,chair:0,decor:0},un:{},loc:0,lu:[1,0,0,0],dex:{},dexM:0,snd:true,tut:0});
let save=DEF();try{const s=JSON.parse(ls.get(KEY)||'null');if(s&&typeof s==='object')save=Object.assign(DEF(),s)}catch(e){}
save.up=Object.assign(DEF().up,save.up||{});if(!save.un||typeof save.un!=='object')save.un={};if(!save.stars||typeof save.stars!=='object')save.stars={};if(!save.dex||typeof save.dex!=='object')save.dex={};
if(!Array.isArray(save.lu)||save.lu.length<4)save.lu=[1,0,0,0];if(!(save.loc>=0&&save.loc<4&&save.lu[save.loc]))save.loc=0;
const store=()=>ls.set(KEY,JSON.stringify(save));
const rnd=(a,b)=>a+Math.random()*(b-a),ri=n=>Math.floor(Math.random()*n),fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
/* ---------- data ---------- */
const FLAV=[{id:'v',n:'바닐라',c:'#fff3d6',e:'🤍',pm:1,day:1},{id:'s',n:'딸기',c:'#ff9ec0',e:'🍓',pm:1,day:1},{id:'c',n:'초코',c:'#8a5a3c',e:'🍫',pm:1,day:4},{id:'m',n:'민트',c:'#8be0c0',e:'🌿',pm:1,day:7},{id:'g',n:'포도',c:'#b58cff',e:'🍇',pm:1,day:11},{id:'mg',n:'망고',c:'#ffb347',e:'🥭',pm:1.5,un:'mg'},{id:'mt',n:'말차',c:'#9bc47a',e:'🍵',pm:1.5,un:'mt'},{id:'pk',n:'호박',c:'#f59a3a',e:'🎃',pm:2,un:'pk'},{id:'sk',n:'벚꽃',c:'#ffc9e0',e:'🌸',pm:2,un:'sk'}];
const TOP=[{id:'sp',e:'🌈',n:'스프링클',day:6},{id:'nt',e:'🥜',n:'견과',day:12},{id:'ch',e:'🍒',n:'체리',day:20},{id:'ck',e:'🍪',n:'쿠키',un:'ck'},{id:'sb',e:'🍓',n:'딸기',un:'sb'}];
const SYR=[{id:'cs',e:'🍫',n:'초코시럽',c:'#5a3320',day:8},{id:'ss',e:'🍓',n:'딸기시럽',c:'#ff4f7a',day:14},{id:'hn',e:'🍯',n:'꿀',c:'#f0b030',un:'hn'}];
const AN=['🐶','🐱','🐰','🐻','🐼','🦊','🐯','🐸','🐵','🐧','🐹','🦁'];
const UNL=[{k:'mg',e:'🥭',n:'망고 맛',d:'가격 ×1.5',cost:4000},{k:'mt',e:'🍵',n:'말차 맛',d:'가격 ×1.5',cost:8000},{k:'ck',e:'🍪',n:'쿠키 토핑',d:'새 토핑',cost:2500},{k:'sb',e:'🍓',n:'딸기 토핑',d:'새 토핑',cost:5000},{k:'hn',e:'🍯',n:'꿀 시럽',d:'새 시럽',cost:3500},{k:'pk',e:'🎃',n:'한정 호박 맛',d:'가격 ×2',cost:30000},{k:'sk',e:'🌸',n:'한정 벚꽃 맛',d:'가격 ×2',cost:50000}];
const UPS=[{k:'speed',n:'스쿱 속도',e:'🥄',max:4,d:l=>'스쿱 올리는 시간 -15% (지금 -'+15*l+'%)',c:l=>[600,1500,3500,8000][l]},
{k:'fz',n:'냉동고 칸',e:'🧊',max:6,d:l=>'냉동고 '+(2+l)+'칸 → '+(3+l)+'칸',c:l=>[800,2000,5000,12000,25000,40000][l]},
{k:'helper',n:'서빙 도우미',e:'🐰',max:2,d:l=>l?'더 빨리 서빙해요':'냉동고 아이스크림을 알아서 서빙',c:l=>[3000,10000][l]},
{k:'tip',n:'팁 보너스',e:'💝',max:10,d:l=>'팁 +20% (지금 +'+20*l+'%)',c:l=>l<5?600+l*900:6000*(l-4)},
{k:'sign',n:'간판',e:'🪧',max:6,d:l=>'손님 참을성 +3%',c:l=>[500,1500,4000,8000,20000,50000][l]},
{k:'chair',n:'의자',e:'🪑',max:6,d:l=>'손님 참을성 +3%',c:l=>[500,1500,4000,8000,20000,50000][l]},
{k:'decor',n:'장식',e:'🎀',max:6,d:l=>'손님 참을성 +3%',c:l=>[500,1500,4000,8000,20000,50000][l]}];
const LOC=[{n:'동네 가게',e:'🏠',pm:1,sp:1,mel:1,cost:0,d:'처음 가게예요',wall:'#fff0f6'},{n:'해변 가게',e:'🏖️',pm:1.3,sp:1.15,mel:1.25,cost:60000,d:'가격 ×1.3 · 손님 +15% · 더 빨리 녹아요',wall:'#e6f6ff'},{n:'놀이공원',e:'🎡',pm:1.6,sp:1.35,mel:1,cost:150000,d:'가격 ×1.6 · 손님 +35%',wall:'#fff4d6'},{n:'얼음 궁전',e:'🏰',pm:2,sp:1.2,mel:.6,cost:400000,d:'가격 ×2 · 손님 +20% · 천천히 녹아요',wall:'#e8f0ff'}];
const COS=[{k:'c1',e:'🌴',n:'야자수',cost:15000},{k:'c2',e:'🎈',n:'풍선 다발',cost:30000},{k:'c3',e:'🎠',n:'회전목마',cost:60000},{k:'c4',e:'🦄',n:'유니콘 인형',cost:100000},{k:'c5',e:'👑',n:'황금 왕관 간판',cost:200000},{k:'c6',e:'🎆',n:'불꽃놀이',cost:400000}];
const DEXM=[[10,1000],[25,3000],[50,8000],[100,20000]];
const MX=26;
const isAv=(x,d)=>x.day!==undefined?d>=x.day:!!save.un[x.un];
const flAv=d=>FLAV.map((f,i)=>i).filter(i=>isAv(FLAV[i],d)),tpAv=d=>TOP.filter(t=>isAv(t,d)),syAv=d=>SYR.filter(s=>isAv(s,d));
const maxSc=d=>d<4?1:d<10?2:3;
const nCust=d=>d<4?1:d<10?2:3;
const evOf=d=>d%7===0?'heat':d%10===0?'fest':null;
const EVN={heat:{e:'🥵',n:'폭염',d:'두 배로 빨리 녹아요!',g:1.2},fest:{e:'🎉',n:'아이스크림 축제',d:'손님 폭주! 팁 ×1.5',g:1.4}};
const goalOf0=(d,ev)=>Math.round((500+10500*(1-Math.exp(-(d-1)/20)))*gmul()*(ev?EVN[ev].g:1)*(d<=7?.8:1)/50)*50;
const trN=d=>save.tr&&save.tr.d===d&&save.tr.n>0?Math.min(4,save.tr.n):0;   // 같은 날 목표미달 횟수 (응원: 한 번 못 채울 때마다 목표 -10%, 최대 -40%)
const goalOf=(d,ev)=>Math.round(goalOf0(d,ev)*(1-.1*trN(d))/50)*50;
function gmul(){const L=LOC[save.loc];return L.pm*(1+(L.sp-1)*.5)}   // 허브 수정: 업그레이드(속도·팁·냉동고·도우미)는 목표에 반영하지 않음 → 돈을 쓰면 실제로 쉬워짐
/* ---------- audio ---------- */
let AC=null;const au=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC};
function tone(f,d,ty='sine',v=.14,t0=0,f2){if(!save.snd||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t0;o.type=ty;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const SND={tap(){tone(520,.07,'triangle',.1)},scoop(){tone(380,.12,'sine',.14,0,620)},coin(){tone(988,.1,'triangle',.12);tone(1319,.18,'triangle',.12,.08)},fail(){tone(190,.3,'sawtooth',.14,0,70)},melt(){tone(300,.25,'sine',.08,0,120)},angry(){tone(240,.25,'square',.09,0,120)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.14,i*.11))},no(){tone(200,.1,'square',.07)}};
const snd=k=>SND[k]();

/* ---------- screens ---------- */
let g=null,scr='menu',paused=false,shopBack='menu',tutI=0,lastTs=0,saveT=0;
const show=n=>{['menu','shop','dex','res','pause','set','tut'].forEach(i=>$(i).style.display=i===n?'block':'none');$('home').style.display=scr==='game'?'block':'none'};
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1500)}
const starsT=()=>Object.values(save.stars).reduce((a,b)=>a+b,0);
function okIt(o){return !!o&&(o.c==='cone'||o.c==='cup')&&Array.isArray(o.sc)&&o.sc.every(i=>Number.isInteger(i)&&i>=0&&i<FLAV.length)&&Array.isArray(o.tp)&&(o.sy==null||typeof o.sy==='string')}
function readRun(){const t=ls.get(KRUN);if(!t)return null;try{const d=JSON.parse(t);if(d&&d.v===1&&d.day===save.day&&isFinite(d.t)&&d.t>=0&&d.t<300&&d.hearts>0&&Array.isArray(d.cust)&&d.cust.length===3&&Array.isArray(d.fz)&&d.fz.every(okIt)&&(d.hand==null||okIt(d.hand))&&d.cust.every(c=>c===null||(c&&Array.isArray(c.items)&&c.items.length>0&&c.items.every(okIt)&&Array.isArray(c.done)&&isFinite(c.pat)&&isFinite(c.max))))return d}catch(e){}return null}
function saveRun(){if(!g||scr!=='game'||g.ph!=='play')return;ls.set(KRUN,JSON.stringify({v:1,day:g.day,t:g.t,hearts:g.hearts,rev:g.rev,fails:g.fails,combo:g.combo,bc:g.bc,spawnT:g.spawnT,cust:g.cust,hand:g.hand,fz:g.fz,ev:g.ev}))}
function renderMenu(){const run=readRun(),ev=evOf(save.day);
 $('mw').innerHTML='<span class="pill">🪙 '+fmt(save.coins)+'</span><span class="pill">📅 '+save.day+'일차</span>';
 $('mi').innerHTML=LOC[save.loc].e+' '+LOC[save.loc].n+(ev?'<br>'+EVN[ev].e+' <b>'+EVN[ev].n+'!</b> '+EVN[ev].d:'')+'<br>오늘 목표 <b>'+fmt(goalOf(save.day,ev))+'원</b>'+(trN(save.day)?' <span style="font-size:14px;color:#3a9a5a">🍀 응원 -'+trN(save.day)*10+'%</span>':'')+'<br>⭐ '+starsT()+' · 🏅 콤보 '+save.bestCombo+' · 🏆 최고 '+save.bestDay+'일차';
 $('m1').textContent=run?'⏯ 이어서 하기 ('+save.day+'일차)':'▶ '+save.day+'일차 시작';$('m5').style.display=run?'block':'none';$('m5').textContent='🔁 오늘 처음부터 다시 시작'}
function renderShop(){$('sw').innerHTML='<span class="pill">🪙 '+fmt(save.coins)+'</span>';const L=$('shl');L.innerHTML='';
 const hd=t=>{const p=document.createElement('p');p.style.cssText='margin:8px 0 6px;font-size:17px';p.innerHTML='<b>'+t+'</b>';L.appendChild(p)};
 const row=(e,n,d,label,can,fn)=>{const r=document.createElement('div');r.className='it';r.innerHTML='<b>'+e+'</b><div><span>'+n+'</span><br>'+d+'</div>';const b=document.createElement('button');b.textContent=label;if(!can)b.className='no';b.onclick=fn;r.appendChild(b);L.appendChild(r)};
 const buy=(cost,fn)=>{if(save.coins<cost){toast('코인이 부족해요!');snd('no');return}save.coins-=cost;fn();store();snd('win');renderShop();renderMenu()};
 hd('⬆️ 가게 업그레이드');
 UPS.forEach(u=>{const lv=save.up[u.k],mx=lv>=u.max,c=mx?0:u.c(lv);row(u.e,u.n+' Lv'+lv+'/'+u.max,mx?'최고 레벨!':u.d(lv),mx?'완료 ✅':fmt(c)+'🪙',!mx&&save.coins>=c,()=>{if(!mx)buy(c,()=>save.up[u.k]++)})});
 hd('🆕 새 메뉴 · 한정 메뉴');
 UNL.forEach(u=>{const own=save.un[u.k];row(u.e,u.n,u.d,own?'해금 ✅':fmt(u.cost)+'🪙',!own&&save.coins>=u.cost,()=>{if(!own)buy(u.cost,()=>save.un[u.k]=1)})});
 hd('🎁 가게 꾸미기 수집 (자랑용!)');
 COS.forEach(u=>{const own=save.un[u.k];row(u.e,u.n,'가게에 장식으로 놓여요',own?'놓았어요 ✅':fmt(u.cost)+'🪙',!own&&save.coins>=u.cost,()=>{if(!own)buy(u.cost,()=>save.un[u.k]=1)})});
 hd('🗺️ 가게 장소');
 LOC.forEach((lc,i)=>{const own=save.lu[i],pv=i===0||save.lu[i-1];
  if(own)row(lc.e,lc.n,lc.d,save.loc===i?'장사 중 ✅':'여기서 장사',save.loc!==i,()=>{save.loc=i;store();snd('tap');renderShop();renderMenu()});
