<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>말랑말랑 인형뽑기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/kit.css">
<style>
#ctl{position:absolute;left:0;right:0;bottom:0;height:150px;display:none;pointer-events:auto;padding:10px 14px 14px;background:linear-gradient(#ff9ec4,#e0709c);border-radius:26px 26px 0 0;box-shadow:0 -4px 0 rgba(0,0,0,.08)}
#ctl.on{display:block}
#ctl .row1{display:flex;gap:8px;align-items:center;margin-bottom:10px}
#ctl .row1 .pill{font-size:17px;padding:5px 12px}
#ctl .row1 .sp{flex:1}
#ctl .row1 button{height:40px;padding:0 12px;font-size:16px}
#ctl .row2{display:flex;gap:10px;align-items:center}
.arr{width:78px;height:72px;font-size:34px;border-radius:22px}
#grab{flex:1;height:76px;font-size:30px;border-radius:38px;background:radial-gradient(circle at 50% 35%,#ff7070,#e03050);color:#fff;box-shadow:0 7px 0 #a01838;text-shadow:0 2px 0 rgba(0,0,0,.2)}
#grab:active{box-shadow:0 2px 0 #a01838}
#grab:disabled{filter:grayscale(.6) brightness(.9)}
#timer{position:absolute;left:50%;top:6px;transform:translateX(-50%)}
#col .panel{position:absolute;left:14px;right:14px;top:18px;bottom:18px;background:var(--card);border-radius:28px;padding:14px;display:flex;flex-direction:column}
#col h2{margin:0 0 6px;font-size:26px;font-weight:400;display:flex;align-items:center;gap:8px}
#col h2 span{flex:1}
#col .grid{flex:1;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start;padding:4px}
#col .it{background:#fff;border-radius:16px;box-shadow:0 3px 0 #eadcf2;text-align:center;padding:6px 2px;font-size:13px;position:relative}
#col .it img{width:58px;height:58px;object-fit:contain;display:block;margin:0 auto 2px}
#col .it.no img{filter:brightness(0) opacity(.18)}
#col .it b{position:absolute;right:6px;top:4px;font-weight:400;color:#e08a00;font-size:13px}
#col .it.rare{background:linear-gradient(#fff,#fff3c4)}
#win{background:rgba(40,20,60,.55)}
#win .card img{height:150px;max-width:220px;object-fit:contain;animation:kbob 1.2s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))}
.new{display:inline-block;background:#ff5a8a;color:#fff;border-radius:10px;padding:2px 10px;font-size:16px;margin-left:6px}
#home{background:linear-gradient(rgba(255,214,232,.9),rgba(214,200,255,.92))}
#home .logo{position:absolute;left:0;right:0;top:9%;text-align:center;font-size:48px;line-height:1.05;color:#fff;text-shadow:0 4px 0 #e0709c,0 0 18px rgba(255,140,190,.6);-webkit-text-stroke:2px #c2588a;animation:kbob 2.4s ease-in-out infinite}
#home .logo small{display:block;font-size:19px;-webkit-text-stroke:0;color:#fff;text-shadow:0 2px 0 #c2588a;margin-top:8px}
#home .pets{position:absolute;left:0;right:0;top:calc(9% + 150px);display:flex;justify-content:center;gap:4px}
#home .pets img{height:76px;animation:kbob 1.6s ease-in-out infinite}
#home .pets img:nth-child(2){animation-delay:.3s;height:92px}#home .pets img:nth-child(3){animation-delay:.6s}
#home .menu{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);width:270px;display:flex;flex-direction:column;gap:14px}
#home .menu button{height:62px;font-size:24px}
#home .info{position:absolute;left:0;right:0;bottom:calc(12% + 160px);text-align:center;display:flex;gap:8px;justify-content:center}
#sbtn{left:12px;top:14px}
</style></head><body>
<div id="game"></div>
<div id="ui">
 <div id="home" class="scr"><div class="logo">말랑말랑<br>인형뽑기<small>🧸 동물 친구 인형 33종을 모아요!</small></div>
  <div class="pets"><img src="../animal-run/img/ch/01.webp" alt=""><img src="../animal-run/img/ch/00.webp" alt=""><img src="../animal-run/img/ch/04.webp" alt=""></div>
  <div class="info"><span class="pill" id="hc">🪙 0</span><span class="pill" id="hd">📖 0/33</span></div>
  <div class="menu"><button class="gold" id="bGo">🕹️ 뽑으러 가기</button><button class="pinkb" id="bCol">📖 인형 도감</button></div>
  <button class="topbtn" id="sbtn">🔊</button></div>
 <div id="col" class="scr"><div class="dim"></div><div class="panel"><h2>📖 인형 도감<span></span><small class="pill" id="cc">0/33</small><button class="topbtn" style="position:static" id="cx">✖</button></h2><div class="grid" id="cg"></div></div></div>
 <div id="win" class="scr"><div class="card"><h2 id="wT">🎉 뽑았어요!</h2><img id="wI" alt=""><div class="rline" id="wN"></div><div style="font-size:16px;color:#8a6a9a" id="wD"></div><div class="row"><button class="gold" id="wGo">계속 뽑기 ▶</button></div></div></div>
 <div id="ctl"><div class="row1"><span class="pill" id="cn">🪙 0</span><span class="pill" id="cd">📖 0/33</span><span class="sp"></span><button id="bFree" style="display:none">🪙 +5 받기</button><button id="bMenu">🏠</button></div>
  <div class="row2"><button class="arr" id="bL">◀</button><button id="grab">⬇ 잡기!</button><button class="arr" id="bR">▶</button></div></div>
 <span class="pill" id="timer" style="display:none"></span>
 <div class="toast" id="toast"></div>
</div>
<div id="load"><div class="pw">🧸</div><div>인형을 채우는 중…</div><div class="bar"><i id="lbar"></i></div></div>
<script src="../lib/phaser.min.js"></script>
<script src="../lib/kit.js"></script>
<script src="game.js"></script>
</body></html>
