['가는 토끼 잡으려다','잡은 토끼 놓친다','잡은 토끼','욕심내다가 가진 것까지 잃어요.',3],
['구슬이 서 말이라도','꿰어야 보배','꿰어야','아무리 좋은 것도 쓸모 있게 만들어야 값져요.',3],
['우물을 파도','한 우물을 파라','한 우물을','한 가지 일에 집중해서 끝까지 해야 해요.',3],
['공든 탑이','무너지랴','공든','정성을 들인 일은 헛되지 않아요.',3],
['비 온 뒤에','땅이 굳는다','땅이','어려움을 겪은 뒤에 더 단단해져요.',3],
['원수는','외나무다리에서 만난다','외나무다리에서','피하고 싶은 사람을 꼭 마주치게 돼요.',3],
['남의 잔치에','감 놓아라 배 놓아라 한다','감','남의 일에 쓸데없이 간섭해요.',3],
['수박','겉핥기','겉핥기','속은 모르고 겉만 대충 알아요.',3],
['새 발의','피','피','아주 적은 양이에요.',3],
['눈 가리고','아웅 한다','아웅','뻔히 보이는 얕은 속임수를 써요.',3],
['가까운 이웃이','먼 사촌보다 낫다','이웃이','급할 때는 가까이 사는 이웃이 더 도움이 돼요.',3],
['호박이','넝쿨째 굴러떨어졌다','넝쿨째','뜻밖에 큰 행운이 찾아왔어요.',3],
['고양이 목에','방울 달기','방울','실행하기 어려운 일을 의논만 해요.',3],
['번갯불에','콩 볶아 먹겠다','콩','행동이 아주 재빨라요.',3],
['돌다리도','두들겨 보고 건너라','돌다리도','잘 아는 일도 조심해서 확인해요.',3],
['얌전한 고양이가','부뚜막에 먼저 올라간다','부뚜막에','얌전해 보이는 사람이 먼저 엉뚱한 일을 해요.',3],
['자라 보고 놀란 가슴','솥뚜껑 보고 놀란다','솥뚜껑','한 번 놀란 일 때문에 비슷한 것만 봐도 겁을 내요.',3],
['입에 쓴 약이','몸에 좋다','약이','듣기 싫은 충고가 나중에는 도움이 돼요.',3],
['두 마리 토끼를 쫓다가','한 마리도 못 잡는다','두 마리','욕심내서 여러 가지를 하면 하나도 못 이뤄요.',3],
['장고 끝에','악수 둔다','악수','너무 오래 생각하면 오히려 실수해요.',3],
['피는','물보다 진하다','진하다','가족은 남보다 특별히 가까워요.',3],
['말 타면','경마 잡히고 싶다','경마','사람의 욕심은 끝이 없어요.',3],
['개천에서','용 난다','용','어려운 환경에서도 훌륭한 사람이 나와요.',3],
['똥 묻은 개가','겨 묻은 개 나무란다','겨','자기 허물은 모르고 남의 작은 허물을 흉봐요.',3]
];
const full=i=>PR[i][0]+' '+PR[i][1];
/* ---------- level design ---------- */
const NQ=8;
const typesOf=l=>l<=2?['A']:l<=4?['A','B']:l<=6?['A','B','C']:l<=9?['A','B','C','D']:['A','B','C','D','D'];
const tiersOf=l=>l<=2?[1]:l<=4?[1,1,2]:l<=6?[1,2,2]:l<=9?[2,2,3]:[2,3,3];
const nChoice=l=>l<=2?3:4;
const timeOf=(l,ty)=>l<4?0:Math.max(8,22-l)+(ty==='D'?10:0);
function pickIds(l){const used=new Set(),out=[],tiers=tiersOf(l);let guard=0;
 while(out.length<NQ&&guard++<500){const t=tiers[ri(tiers.length)];const pool=[];PR.forEach((p,i)=>{if(p[4]===t&&!used.has(i)){const w=(save.dex[i]?1:4)+(save.wrong[i]||0)*3;for(let k=0;k<w;k++)pool.push(i)}});
  if(!pool.length)continue;const id=pool[ri(pool.length)];used.add(id);out.push(id)}
 while(out.length<NQ){const id=ri(PR.length);if(!used.has(id)){used.add(id);out.push(id)}}return out}
function near(arr,len,k){return arr.sort((a,b)=>Math.abs(a.length-len)-Math.abs(b.length-len)).slice(0,k)}
function mkQ(id,ty,l){const p=PR[id],n=nChoice(l);let ch,ans;
 const others=PR.map((q,i)=>i).filter(i=>i!==id);
 const pick=(cands,len,k)=>{const u=[...new Set(cands)];return shuf(l>=5?near(u.sort(()=>Math.random()-.5),len,8):u).slice(0,k)};
 if(ty==='A'){const c=pick(others.map(i=>PR[i][1]).filter(x=>x!==p[1]),p[1].length,n-1);ch=shuf([p[1],...c]);ans=ch.indexOf(p[1])}
 else if(ty==='B'){const c=pick(others.map(i=>PR[i][2]).filter(x=>x!==p[2]&&!full(id).includes(x)),p[2].length,n-1);ch=shuf([p[2],...c]);ans=ch.indexOf(p[2])}
 else if(ty==='C'){const c=pick(others.filter(i=>PR[i][3]!==p[3]).map(i=>full(i)),full(id).length,n-1);ch=shuf([full(id),...c]);ans=ch.indexOf(full(id))}
 else{let ws=full(id).split(' ');if(ws.length>6){const k=Math.ceil(ws.length/4),g=[];for(let i=0;i<ws.length;i+=k)g.push(ws.slice(i,i+k).join(' '));ws=g}
  ch=ws.slice();let tries=0;do{shuf(ch)}while(ch.join(' ')===ws.join(' ')&&tries++<20);ans=-1}
 return{id,ty,ch,ans}}
function build(l){const ids=pickIds(l),ts=typesOf(l),qs=[];ids.forEach((id,i)=>{let ty=ts[Math.min(ts.length-1,ri(ts.length))];if(i===0)ty='A';qs.push(mkQ(id,ty,l))});return qs}
/* ---------- state ---------- */
let s=null,scr='menu',paused=false,lastTs=0;
const show=n=>{['menu','lvs','dex','res','pause','set','play'].forEach(i=>$(i).style.display=i===n?'block':'none');$('home').style.display=scr==='game'?'block':'none'};
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1500)}
const okQ=q=>q&&Number.isInteger(q.id)&&q.id>=0&&q.id<PR.length&&['A','B','C','D'].includes(q.ty)&&Array.isArray(q.ch)&&q.ch.length>=2&&q.ch.length<=8&&q.ch.every(x=>typeof x==='string'&&x.length<80)&&Number.isInteger(q.ans)&&q.ans>=-1&&q.ans<q.ch.length;
function readRun(){const t=ls.get(KRUN);if(!t)return null;try{const d=JSON.parse(t);if(Number.isInteger(d.level)&&d.level>=1&&Array.isArray(d.qs)&&d.qs.length===NQ&&d.qs.every(okQ)&&Number.isInteger(d.i)&&d.i>=0&&d.i<NQ&&d.hearts>=1&&d.hearts<=3&&d.ok>=0&&d.ok<=NQ)return d}catch(e){}return null}
function saveRun(){if(!s||scr!=='game'||s.ph!=='ask')return;ls.set(KRUN,JSON.stringify({level:s.level,qs:s.qs,i:s.i,hearts:s.hearts,ok:s.ok,hints:s.hints,streak:s.streak,nd:s.nd,bad:s.bad}))}
function renderMenu(){const rd=readRun();$('mw').innerHTML='<span class="pill">🏆 '+save.bestLevel+'단계</span><span class="pill">📖 '+Object.keys(save.dex).length+' / '+PR.length+'</span><span class="pill">🔥 최고 '+save.bestStreak+'</span>';
 $('g0').textContent=rd?'⏯ 이어서 하기 ('+rd.level+'단계 · '+(rd.i+1)+'/'+NQ+')':'▶ '+save.level+'단계 시작'}
function renderLvs(){const L=$('lvl');L.innerHTML='';for(let l=1;l<=save.bestLevel;l++){const b=document.createElement('button');b.innerHTML=l+'<small>'+'⭐'.repeat(save.stars[l]||0)+'</small>';b.onclick=()=>{au();ls.del(KRUN);startLevel(l)};L.appendChild(b)}}
function renderDex(){const ks=Object.keys(save.dex).map(Number).filter(i=>PR[i]).sort((a,b)=>a-b);$('dw').innerHTML='<span class="pill">📖 '+ks.length+' / '+PR.length+'개 모았어요</span>';
 $('dl').innerHTML=ks.length?ks.map(i=>'<div class="dxi">'+full(i)+'<small>'+PR[i][3]+'</small></div>').join(''):'<p style="text-align:center;font-size:18px;margin-top:40px">아직 없어요.<br>속담을 맞히면 도감에 모여요!</p>'}
function startLevel(l,rd){s={level:l,qs:rd?rd.qs:build(l),i:rd?rd.i:0,hearts:rd?rd.hearts:3,ok:rd?rd.ok:0,hints:rd?rd.hints:2,streak:rd?rd.streak:0,nd:rd?rd.nd:0,bad:rd?rd.bad:0,ph:'ask',t:0,lim:0,ans:[],off:[],bs:0};
 scr='game';paused=false;lastTs=0;if(!rd)ls.del(KRUN);show('play');showQ()}
function showQ(){const q=s.qs[s.i],p=PR[q.id];s.ph='ask';s.ans=[];s.off=[];s.lim=timeOf(s.level,q.ty);s.t=0;
 $('hl').textContent=s.level+'단계 · '+(s.i+1)+'/'+NQ;$('hh').textContent='❤️'.repeat(s.hearts)+'🖤'.repeat(3-s.hearts);
 const T={A:'뒤에 이어질 말을 골라요',B:'빈칸에 들어갈 말은?',C:'이런 뜻의 속담은?',D:'순서대로 눌러 속담을 완성해요'};$('qt').textContent=T[q.ty];
 $('qx').innerHTML=q.ty==='A'?p[0]+' <b>&nbsp;&nbsp;&nbsp;</b>':q.ty==='B'?full(q.id).replace(p[2],'<b>&nbsp;&nbsp;&nbsp;</b>'):q.ty==='C'?'“'+p[3]+'”':'🧩';
 $('fb').style.display='none';$('ch').style.display='block';
 if(q.ty==='D')renderD();else{$('ch').innerHTML=q.ch.map((c,i)=>'<button data-i="'+i+'">'+c+'</button>').join('');}
 $('hint').style.display=q.ty==='D'?'none':'block';$('hint').textContent='💡 두 개 지우기 ('+s.hints+')';
 $('tb').style.visibility=s.lim?'visible':'hidden';$('tf').style.width='100%'}
function renderD(){const q=s.qs[s.i];$('ch').innerHTML='<div id="ans">'+s.ans.map(i=>'<button data-a="'+i+'">'+q.ch[i]+'</button>').join('')+'</div><div id="pool">'+q.ch.map((c,i)=>s.ans.includes(i)?'':'<button data-p="'+i+'">'+c+'</button>').join('')+'</div><button id="go" class="big" '+(s.ans.length===q.ch.length?'':'style="opacity:.4"')+'>확인</button>'}
$('ch').onclick=e=>{const b=e.target.closest('button');if(!b||!s||s.ph!=='ask'||paused)return;au();const q=s.qs[s.i];
 if(q.ty!=='D'){if(b.dataset.i===undefined)return;answer(+b.dataset.i);return}
 if(b.dataset.p!==undefined){s.ans.push(+b.dataset.p);snd('tap');renderD()}else if(b.dataset.a!==undefined){const k=+b.dataset.a;s.ans=s.ans.filter(x=>x!==k);snd('tap');renderD()}else if(b.id==='go'){if(s.ans.length!==q.ch.length){toast('조각을 다 놓아요!');return}answer(-2)}};
$('hint').onclick=()=>{if(!s||s.ph!=='ask'||paused)return;au();if(s.hints<=0){toast('힌트를 다 썼어요');return}const q=s.qs[s.i];if(q.ty==='D')return;const w=q.ch.map((c,i)=>i).filter(i=>i!==q.ans&&!s.off.includes(i));if(w.length<2){toast('더 지울 게 없어요');return}shuf(w);s.off.push(w[0],w[1]);s.hints--;snd('tap');[...$('ch').children].forEach((b,i)=>{if(s.off.includes(i))b.classList.add('off')});$('hint').textContent='💡 두 개 지우기 ('+s.hints+')'};
function answer(idx){const q=s.qs[s.i],p=PR[q.id];s.ph='fb';let good;
 if(q.ty==='D')good=s.ans.map(i=>q.ch[i]).join(' ')===full(q.id);else good=idx===q.ans;
 if(idx===-1)good=false;
 if(q.ty!=='D'){[...$('ch').children].forEach((b,i)=>{if(i===q.ans)b.classList.add('ok');else if(i===idx)b.classList.add('no')})}
 if(good){s.ok++;s.streak++;save.bestStreak=Math.max(save.bestStreak,s.streak);if(!save.dex[q.id]){s.nd++}save.dex[q.id]=(save.dex[q.id]||0)+1;snd('ok')}
 else{s.hearts--;s.streak=0;s.bad++;save.wrong[q.id]=(save.wrong[q.id]||0)+1;snd('bad')}
 store();
 $('fr').textContent=good?'⭕ 맞았어요!'+(s.streak>=3?' 🔥'+s.streak+'연속':''):(idx===-1?'⏰ 시간이 끝났어요':'❌ 아쉬워요');$('fp').textContent=full(q.id);$('fm').textContent=p[3];
 $('fb').style.display='block';$('hh').textContent='❤️'.repeat(Math.max(0,s.hearts))+'🖤'.repeat(3-Math.max(0,s.hearts));
 $('nx').textContent=s.hearts<=0||s.i===NQ-1?'결과 보기 ▶':'다음 ▶';
 if(q.ty==='D'){$('ch').style.display='none'}
 saveRunAfter()}
function saveRunAfter(){/* 다음 문제로 넘어갈 상태로 저장 */if(s.hearts<=0||s.i===NQ-1){ls.del(KRUN);return}ls.set(KRUN,JSON.stringify({level:s.level,qs:s.qs,i:s.i+1,hearts:s.hearts,ok:s.ok,hints:s.hints,streak:s.streak,nd:s.nd,bad:s.bad}))}
$('nx').onclick=()=>{if(!s||s.ph!=='fb')return;au();if(s.hearts<=0||s.i===NQ-1){finish();return}s.i++;showQ()};
function finish(){s.ph='end';ls.del(KRUN);const won=s.hearts>0;scr='result';
 if(won){s.stars=s.bad===0?3:s.bad===1?2:1;save.stars[s.level]=Math.max(save.stars[s.level]||0,s.stars);if(s.level>=save.level)save.level=s.level+1;save.bestLevel=Math.max(save.bestLevel,save.level);snd('win')}else snd('lose');store();
 $('rt').textContent=won?'🎉 '+s.level+'단계 성공! '+'⭐'.repeat(s.stars)+'☆'.repeat(3-s.stars):'💔 하트가 없어졌어요';
 $('rbd').innerHTML='⭕ 맞힌 문제 '+s.ok+' / '+NQ+'<br>📖 새로 모은 속담 <b>'+s.nd+'</b>개 (모두 '+Object.keys(save.dex).length+'개)'+(won?'':'<br>틀린 속담은 더 자주 나와서 금방 익힐 수 있어요!');
 $('r1').textContent=won?'▶ '+(s.level+1)+'단계':'🔁 다시 도전';$('r1').onclick=()=>{au();startLevel(won?s.level+1:s.level)};$('r2').style.display=won?'block':'none';$('r2').onclick=()=>{au();startLevel(s.level)};show('res')}
function pauseGame(){if(scr!=='game'||!s||paused||s.ph==='end')return;paused=true;saveRun();$('pause').style.display='block'}
function resumeGame(){if(!paused)return;paused=false;$('pause').style.display='none';lastTs=0}
function toMenu(){if(s&&s.ph!=='end'){if(s.ph==='ask')saveRun();}scr='menu';s=null;paused=false;renderMenu();show('menu')}
$('g0').onclick=()=>{au();const rd=readRun();if(rd)startLevel(rd.level,rd);else startLevel(save.level)};
$('g2').onclick=()=>{au();renderLvs();show('lvs')};$('lx').onclick=()=>show('menu');
$('g3').onclick=()=>{au();renderDex();show('dex')};$('dx').onclick=()=>show('menu');
const setLbl=()=>{$('sn').textContent=save.snd?'🔊 소리 켜짐':'🔇 소리 꺼짐';$('rs').textContent='🗑️ 기록 지우기';$('rs').dataset.s='0'};
$('g4').onclick=()=>{au();setLbl();show('set')};$('sc').onclick=()=>show('menu');$('sn').onclick=()=>{save.snd=!save.snd;store();setLbl()};
$('rs').onclick=()=>{const b=$('rs');if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='⚠️ 정말 지울까요? 한 번 더!';setTimeout(()=>{b.dataset.s='0';b.textContent='🗑️ 기록 지우기'},3000)}else{save=DEF();store();ls.del(KRUN);setLbl();renderMenu();toast('모두 지웠어요')}};
$('home').onclick=pauseGame;$('p1').onclick=()=>{au();resumeGame()};$('p2').onclick=toMenu;$('r3').onclick=toMenu;
function upd(dt){if(!s||s.ph!=='ask'||!s.lim)return;s.t+=dt;$('tf').style.width=Math.max(0,100*(1-s.t/s.lim))+'%';if(s.t>=s.lim)answer(-1)}
function fit(){K=Math.min(innerWidth/W,innerHeight/H);$('box').style.transform='translate('+Math.round((innerWidth-W*K)/2)+'px,'+Math.round((innerHeight-H*K)/2)+'px) scale('+K+')'}
function loop(ts){requestAnimationFrame(loop);const dt=lastTs?Math.min(.1,(ts-lastTs)/1000):0;lastTs=ts;if(scr==='game'&&!paused)upd(dt)}
addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseGame();store()}});
addEventListener('pagehide',()=>{pauseGame();store()});
fit();renderMenu();show('menu');requestAnimationFrame(loop);
})();
</script></body></html>
