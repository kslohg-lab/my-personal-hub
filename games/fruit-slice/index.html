<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>과일 썰기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/kit.css">
<style>
html,body{background:#5a3a2a}
#game canvas{display:block}
#home{background:linear-gradient(rgba(90,55,35,.55),rgba(50,30,20,.85))}
#home .logo{position:absolute;left:0;right:0;top:9%;text-align:center;font-size:54px;line-height:1.05;color:#fff;text-shadow:0 4px 0 #e0703a,0 0 20px rgba(255,255,255,.45);-webkit-text-stroke:2px #e0703a;animation:kbob 2.4s ease-in-out infinite}
#home .logo small{display:block;font-size:19px;-webkit-text-stroke:0;color:#fff;text-shadow:0 2px 0 #e0703a;margin-top:10px}
#home .how{position:absolute;left:30px;right:30px;top:calc(9% + 150px);background:rgba(255,255,255,.12);color:#eef;border-radius:20px;padding:10px 14px;font-size:16px;line-height:1.7;text-align:center}
#home .menu{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);width:280px;display:flex;flex-direction:column;gap:12px}
#home .menu button{height:62px;font-size:25px}
#home .best{text-align:center}
#hud{position:absolute;left:0;right:0;top:0;display:none;padding:10px 10px 0 66px;gap:8px;align-items:center;pointer-events:none}
#hud.on{display:flex}
#hud .pill{font-size:18px;white-space:nowrap}
#hud .pill:empty{display:none}
#hud .sp{flex:1}
#hud .pill{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.35);box-shadow:none}
#pbtn{left:10px;top:8px;display:none}
#sbtn{left:12px;top:14px}

</style></head><body>
<div id="game"></div>
<div id="ui">
 <div id="hud"><span class="pill" id="hA"></span><span class="sp"></span><span class="pill" id="hB"></span><span class="pill" id="hC"></span></div>
 
 <div id="home" class="scr"><div class="logo">슥삭<br>과일 썰기<small>🍉 날아오는 과일을 슥!</small></div>
  <div class="how">👆 손가락으로 <b>슥 그어서</b> 과일을 잘라요<br>한 번에 여러 개 = 콤보!<br>💣 폭탄은 피하고, 과일을 놓치면 ♥ -1</div>
  <div class="menu"><div class="best"><span class="pill" id="hb"></span></div><button class="gold" id="bGo">▶ 시작!</button></div>
  <button class="topbtn" id="sbtn">🔊</button></div>
 <div id="pause" class="scr"><div class="dim"></div><div class="card"><h2>⏸️ 잠깐!</h2><div class="row"><button class="gold" id="pGo">▶ 계속</button><button id="pHome">🏠 처음</button></div></div></div>
 <div id="res" class="scr"><div class="dim"></div><div class="card"><h2 id="rT"></h2><div id="rB"></div><div class="row"><button class="gold" id="rRe">🔁 다시</button><button id="rHome">🏠 처음</button></div></div></div>
 <button class="topbtn" id="pbtn">⏸️</button>
 <div class="toast" id="toast"></div>
</div>
<div id="load"><div class="pw">🍉</div><div>칼 가는 중…</div><div class="bar"><i id="lbar"></i></div></div>
<script src="../lib/phaser.min.js"></script>
<script src="../lib/kit.js"></script>
<script src="game.js"></script>
</body></html>
