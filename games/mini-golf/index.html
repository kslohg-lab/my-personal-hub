<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>알록달록 미니골프</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lib/kit.css">
<style>
#home{background:linear-gradient(rgba(120,210,140,.82),rgba(255,240,200,.92))}
#home .logo{position:absolute;left:0;right:0;top:8%;text-align:center;font-size:52px;line-height:1.05;color:#fff;text-shadow:0 4px 0 #2f9a4a,0 0 18px rgba(120,255,150,.6);-webkit-text-stroke:2px #1f7a3a;animation:kbob 2.4s ease-in-out infinite}
#home .logo small{display:block;font-size:19px;-webkit-text-stroke:0;color:#fff;text-shadow:0 2px 0 #1f7a3a;margin-top:8px}
#home .box{position:absolute;left:24px;right:24px;bottom:8%;display:flex;flex-direction:column;gap:12px}
#home .box button.big{height:62px;font-size:24px}
#home .who{display:flex;gap:8px;justify-content:center}
#home .who button{height:46px;padding:0 12px;font-size:18px}
#home .who button.on{background:#ffd25a;box-shadow:0 5px 0 #e0a92e}
#home .lb{text-align:center;font-size:16px;color:#3a6a3a}
#home .best{text-align:center}
#home .how{position:absolute;left:30px;right:30px;top:calc(8% + 140px);background:rgba(255,255,255,.85);border-radius:20px;padding:10px 14px;font-size:16px;line-height:1.65;text-align:center}
#hud{position:absolute;left:0;right:0;top:0;display:none;padding:10px 10px 0 66px;gap:8px;align-items:center;pointer-events:none}
#hud.on{display:flex}
#hud .pill{font-size:18px;white-space:nowrap}
#hud .sp{flex:1}
#hP i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
#pbtn{left:10px;top:8px;display:none}
#sbtn{left:12px;top:14px}
#card table{border-collapse:collapse;width:100%;font-size:15px;margin-top:6px}
#card td,#card th{padding:4px 1px;text-align:center;font-weight:400;border-bottom:1px solid #f0e2cf}
#card th{color:#a08870;font-size:13px}
#card td.n{text-align:left;padding-left:4px;white-space:nowrap}
#card td.t{color:#e08a00;font-size:17px}
#card td.cur{background:#fff0c0}
.u{color:#2a9a4a}.o{color:#d05050}
.hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:#fff;font-size:17px;text-shadow:0 2px 3px rgba(0,0,0,.45);pointer-events:none;transition:opacity .4s}
</style></head><body>
<div id="game"></div>
<div id="ui">
 <div id="hud"><span class="pill" id="hH">1번 홀 · 파 2</span><span class="sp"></span><span class="pill" id="hP"></span><span class="pill" id="hS">0타</span></div>
 <div class="hint" id="hint">👆 공 근처를 뒤로 끌었다 놓으면 쳐요</div>
 <div id="home" class="scr"><div class="logo">알록달록<br>미니골프<small>⛳ 9홀을 가장 적게 쳐서 넣어요!</small></div>
  <div class="how">👆 화면을 <b>뒤로 끌었다 놓으면</b> 공이 날아가요<br>🟫 모래는 느려지고 💧 물에 빠지면 1타 벌칙<br>🔴 범퍼는 통! 튕겨요</div>
  <div class="box"><div class="best"><span class="pill" id="hb">🏆 최고 기록 없음</span></div>
   <button class="big gold" id="bSolo">🏌️ 혼자 치기</button>
   <div class="lb">같이 칠 사람을 골라요 (한 폰을 돌려 가며)</div>
   <div class="who" id="who"></div>
   <button class="big sky" id="bMulti">👨‍👩‍👧‍👧 같이 치기</button></div>
  <button class="topbtn" id="sbtn">🔊</button></div>
 <div id="pause" class="scr"><div class="dim"></div><div class="card"><h2>⏸️ 잠깐!</h2><div class="row"><button class="gold" id="pGo">▶ 계속</button><button id="pCard">📋 점수표</button><button id="pHome">🏠 처음</button></div></div></div>
 <div id="sc" class="scr"><div class="dim"></div><div class="card" id="card"><h2 id="cT"></h2><div id="cB"></div><div class="row"><button class="gold" id="cGo">▶ 다음 홀</button><button id="cHome">🏠 처음</button></div></div></div>
 <button class="topbtn" id="pbtn">⏸️</button>
 <div class="toast" id="toast"></div>
</div>
<div id="load"><div class="pw">⛳</div><div>잔디를 깎는 중…</div><div class="bar"><i id="lbar"></i></div></div>
<script src="../lib/phaser.min.js"></script>
<script src="../lib/kit.js"></script>
<script src="game.js"></script>
</body></html>
